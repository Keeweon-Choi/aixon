  - id: clm:transformer-addresses-sequential
    reviewed_hash: a23252b197b5
    decision: approve
    checks:
      - field: relation
        text: "The Transformer targets the problem of sequential computation in RNNs (no parallelization within a training example)"
        verdict: supported
        sources:
          - url: https://arxiv.org/html/1706.03762v7
            tier: A
            passage: 'The fundamental constraint of sequential computation, however, remains.'
          - url: https://arxiv.org/html/1706.03762v7
            tier: A
            passage: 'The Transformer allows for significantly more parallelization and can reach a new state of the art in translation quality after being trained for as little as twelve hours on eight P100 GPUs.'
          - url: https://arxiv.org/html/1706.03762v7
            tier: A
            passage: 'The goal of reducing sequential computation also forms the foundation of the Extended Neural GPU'
        note: "Introduction states the problem (sequential nature of recurrent models precludes parallelization within training examples; the constraint 'remains'), then proposes the Transformer without recurrence; Background says the goal of reducing sequential computation 'also' underlies prior conv models. The problem entity summary matches the paper's wording (within one training example). Direction correct."
      - field: evidence[0]
        text: "Quote at 1 Introduction, paragraph 4 (html_id S1.p4.1)"
        verdict: supported
        sources:
          - url: https://arxiv.org/html/1706.03762v7
            tier: A
            passage: 'In this work we propose the Transformer, a model architecture eschewing recurrence and instead relying entirely on an attention mechanism to draw global dependencies between input and output.'
        note: "Verbatim first sentence of S1.p4.1. In context (follows the sequential-computation paragraph and is followed by 'allows for significantly more parallelization') it shows the Transformer is designed to remove recurrence, the source of the problem."
      - field: evidence[1]
