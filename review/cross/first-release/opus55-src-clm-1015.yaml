  - id: clm:swin-mitigates-quadratic
    reviewed_hash: 815792d707fc
    decision: approve
    checks:
      - field: relation
        text: "Swin Transformer mitigates the quadratic cost of global self-attention on high-resolution images by computing attention within fixed-size local windows, giving complexity linear in image size"
        verdict: supported
        sources:
          - url: https://arxiv.org/html/2103.14030v2
            tier: A
            passage: 'this would be intractable for Transformer on high-resolution images, as the computational complexity of its self-attention is quadratic to image size.'
          - url: https://arxiv.org/html/2103.14030v2
            tier: A
            passage: 'The linear computational complexity is achieved by computing self-attention locally within non-overlapping windows that partition an image (outlined in red). The number of patches in each window is fixed, and thus the complexity becomes linear to image size.'
        note: "Problem (quadratic cost, dense prediction on high-resolution images) and remedy (window attention, linear in image size for fixed window size; 3.2 Eq. 1-2, M fixed = 7 by default) are both in the paper. Direction correct; 'mitigates' fits since the gain comes from restricting attention to local windows."
      - field: evidence[0]
        text: "Quote at 1 Introduction, paragraph 3 (S1.p3)"
        verdict: supported
        sources:
          - url: https://arxiv.org/html/2103.14030v2
            tier: A
            passage: 'The linear computational complexity is achieved by computing self-attention locally within non-overlapping windows that partition an image (outlined in red). The number of patches in each window is fixed, and thus the complexity becomes linear to image size.'
        note: "Verbatim two sentences in element S1.p3 (3rd introduction paragraph) of 2103.14030v2, which earlier in the same paragraph states the quadratic-cost problem. Condition 'number of patches in each window is fixed' is kept in the quote."
    unchecked: []
