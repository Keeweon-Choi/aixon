  - id: ai:lab-softmax-temp-01
    reviewed_hash: 2a8329962e66
    decision: approve
    checks:
      - field: prompt
        text: "z = [2, 1, 0], T lowered from 1 to 0.1: what happens to the largest probability?"
        verdict: computed
        sources: []
        note: "Scenario is fully specified (logits, T_from, T_to) and matches the item's scenario block; T = 0.1 is inside the lab slider range (0.05-5). Single well-posed question. Learner note (non-blocking): the lab has 5 fixed logit inputs, so z = [2, 1, 0] is reproduced only approximately (e.g. extra logits set very negative)."
      - field: answer
        text: "answer index 0 = 커진다 (increases)"
        verdict: computed
        sources: []
        note: |
          Reference implementation tools/gen_lab_fixtures.py softmax (numpy float64, max-subtraction):
            g.softmax([2,1,0],1)   -> [0.66524096, 0.24472847, 0.09003057]
            g.softmax([2,1,0],0.1) -> [0.99995460, 4.54e-05, 2.06e-09]
          Independent: exp(z/T).max()/exp(z/T).sum() -> 0.6652409558 (T=1), 0.9999546001 (T=0.1).
          Max probability increases 0.665 -> 0.99995, so 커진다 is correct. Matches data/seed/lab_fixtures/softmax_temperature.json.
      - field: choices
        text: "커진다 / 작아진다 / 그대로다"
        verdict: computed
        sources: []
        note: "Exactly one choice is correct (increase). 작아진다 and 그대로다 are clearly wrong by the computation above (0.665 -> 0.99995, a change of +0.335)."
      - field: rationale
        text: "0.665 -> 0.99995: lowering temperature concentrates the distribution on the argmax"
        verdict: computed
        sources: []
        note: "0.66524 rounds to 0.665; 0.9999546 rounds to 0.99995 (5 d.p.). The qualitative statement is correct for T > 0 with a unique maximum logit, which holds here."
    unchecked: []
    fix: ""

