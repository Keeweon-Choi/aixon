  - id: clm:intro-additive-attention
    reviewed_hash: 6d46a79928cb
    decision: approve
    checks:
      - field: relation
        text: "Bahdanau, Cho and Bengio (arXiv 1409.0473v7) present the additive attention mechanism (alignment model parametrized as a feedforward network over decoder state and encoder annotation)"
        verdict: supported
        sources:
          - url: https://arxiv.org/html/1409.0473v7
            tier: A
            passage: 'We parametrize the alignment model a as a feedforward neural network which is jointly trained with all the other components of the proposed system.'
          - url: https://arxiv.org/html/1706.03762v7
            tier: A
            passage: 'The two most commonly used attention functions are additive attention [2], and dot-product (multiplicative) attention.'
          - url: https://arxiv.org/html/1706.03762v7
            tier: A
            passage: 'Dzmitry Bahdanau, Kyunghyun Cho, and Yoshua Bengio. Neural machine translation by jointly learning to align and'
        note: "The Bahdanau paper does not use the name 'additive attention'; it proposes a soft-search alignment model a(s_{i-1}, h_j) parametrized as a feedforward network (3.1). The later name is attested by the Transformer paper, which calls it 'additive attention [2]' with [2] = Bahdanau et al. and describes it as a compatibility function computed by a feed-forward network with a single hidden layer. INTRODUCES (paper presents the method) holds."
      - field: evidence[0]
        text: "Quote at 1 Introduction, paragraph 4 (html_id S1.p4)"
        verdict: supported
        sources:
          - url: https://arxiv.org/html/1409.0473v7
            tier: A
            passage: 'In order to address this issue, we introduce an extension to the encoder–decoder model which learns to align and translate jointly.'
          - url: https://arxiv.org/html/1409.0473v7
            tier: A
            passage: 'Each time the proposed model generates a word in a translation, it (soft-)searches for a set of positions in a source sentence where the most relevant information is concentrated.'
        note: "Verbatim first sentence of S1.p4 in 1409.0473v7. In context the 'extension which learns to align' is the soft-search (attention) mechanism described in the next sentence; its additive/feedforward form is specified in 3.1 (see relation check). Supports the authors introducing the mechanism. Non-blocking suggestion: a second evidence quote from 3.1 ('We parametrize the alignment model a as a feedforward neural network ...') would tie the evidence to the additive form directly."
    unchecked: []
    fix: ""

