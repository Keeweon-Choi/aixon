      tier: A
      passage: Each layer has two sub-layers. The first is a multi-head self-attention mechanism, and the second is a simple, position-wise fully connected feed-forward network.
    note: round 2 재검증. 인용된 clm:multi-head-attention-part-of-transformer-encoder-layer evidence와 같다.
  - field: para:10
