  - field: para:2
    text: 'Google Research 블로그 글 "Transformer: A Novel Neural Network Architecture for Language Understanding"(Jakob Uszkoreit, 2017)'
    verdict: supported
    sources:
    - url: https://research.google/blog/transformer-a-novel-neural-network-architecture-for-language-understanding/
      tier: A
      passage: Posted by Jakob Uszkoreit, Software Engineer, Natural Language Understanding
    note: 같은 페이지에 제목과 날짜 'August 31, 2017'이 있다. 저자는 Transformer 논문 공저자이고 Google Research 공식 블로그라 A로 본다.
  - field: para:2
    text: 블로그는 "I arrived at the bank after crossing the river"를 예로 들며, bank가 강둑임을 정하려면 river를 함께 봐야 한다
    verdict: supported
    sources:
    - url: https://research.google/blog/transformer-a-novel-neural-network-architecture-for-language-understanding/
      tier: A
      passage: For example, deciding on the most likely meaning and appropriate representation of the word “bank” in the sentence “I arrived at the bank after crossing the…” requires knowing if the sentence ends in “... road.” or “... river.”
    note: 예문 전체('I arrived at the bank after crossing the river')는 같은 글의 The Transformer 절에 있다. 예시는 사람이 쓴 글에서 왔고 출처가 글 안에 밝혀져 있다.
  - field: para:2
    text: Transformer가 bank의 다음 표현을 계산할 때 다른 모든 단어와 비교해 단어마다 attention 점수를 매긴다
    verdict: supported
    sources:
    - url: https://research.google/blog/transformer-a-novel-neural-network-architecture-for-language-understanding/
      tier: A
      passage: More specifically, to compute the next representation for a given word - “bank” for example - the Transformer compares it to every other word in the sentence. The result of these comparisons is an attention score for every other word in the sentence.
    note: ''
  - field: para:2
    text: 이 점수가 다른 단어들이 bank의 새 표현에 얼마나 기여할지 정한다
    verdict: supported
    sources:
    - url: https://research.google/blog/transformer-a-novel-neural-network-architecture-for-language-understanding/
      tier: A
      passage: These attention scores determine how much each of the other words should contribute to the next representation of “bank”.
    note: <Cite src=src:url:b301323053b2>가 가리키는 페이지(seed_graph sources)와 같은 URL이다.
  - field: para:2
    text: Scaled Dot-Product Attention은 Transformer에서 이 점수와 비율을 계산하는 연산이다
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: We compute the dot products of the query with all keys, divide each by
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: and apply a softmax function to obtain the weights on the values.
    note: 점수(dot product)와 가중치(softmax)를 계산하는 연산이라는 서술과 맞다. 엄밀히는 가중합 출력까지 포함하지만 문단 5·7에서 설명하므로 오해로 이어지지 않는다.
  - field: para:3
    text: 각 단어(토큰)는 query·key·value 세 가지 역할의 벡터를 가진다
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: In a self-attention layer all of the keys, values and queries come from the same place, in this case, the output of the previous layer in the encoder.
    - url: https://jalammar.github.io/illustrated-transformer/
      tier: C
      passage: So for each word, we create a Query vector, a Key vector, and a Value vector.
    note: self-attention(앞 문단의 bank 예) 문맥에서 맞다. cross-attention에서는 query와 key/value가 다른 곳에서 온다는 점은 문단 13에서 n, m을 따로 두어 다룬다.
  - field: para:4
    text: query는 모든 key와 비교되는 벡터(self-attention에서는 자기 자신의 key도 포함)
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: We compute the dot products of the query with all keys, divide each by
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: Each position in the encoder can attend to all positions in the previous layer of the encoder.
    note: 'round 2 재검증. ''all keys''와 ''모든 위치''에 자기 위치가 포함된다. 계산 확인: self-attention 점수 S = XX^T의 대각 S_ii = x_i·x_i (np.allclose(diag(S), (X*X).sum(1)) → True)로 자기 key와의 점수가 i번째 행에 들어 있다. 디코더도 ''up to and including that position''(§3.2.3)이라 자기 자신을 포함한다.'
  - field: para:4
