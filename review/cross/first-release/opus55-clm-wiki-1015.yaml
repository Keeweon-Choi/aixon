  - field: para:13
    text: Q ∈ R^{n×d_k}, K ∈ R^{m×d_k}, V ∈ R^{m×d_v}, self-attention에서는 m = n
    verdict: computed
    note: '논문은 ''queries and keys of dimension d_k, and values of dimension d_v''를 행렬 Q, K, V로 쌓는다. 차원 일치 확인(numpy): Q=(n,dk),K=(m,dk),V=(m,dv)이면 Q@K.T 모양 (n,m), softmax 후 @V 모양 (n,dv). n=3,m=5,dk=4,dv=6으로 실행해 (3,5),(3,6) 확인. self-attention에서 Q,K,V가 같은 곳에서 온다는 것은 §3.2.3 구절로 확인(''all of the keys, values and queries come from the same place'').'
  - field: para:14
    text: S = QK^T ∈ R^{n×m}, S_ij는 i번째 query와 j번째 key의 dot product
    verdict: computed
    note: (QK^T)_{ij} = Σ_l Q_il K_jl = q_i·k_j. numpy로 무작위 Q,K에서 np.allclose((Q@K.T)[1,2], Q[1]@K[2]) → True.
  - field: para:14
    text: 스케일 S/√d_k, 행마다 softmax를 취한 A의 각 행 합은 1, O = AV ∈ R^{n×d_v}, i번째 출력은 value 행들을 A의 i번째 행 비율로 섞은 것
    verdict: computed
    note: 예제 X(3×2)로 A=softmax(XX^T/√2) 계산, A.sum(1)=[1,1,1]; O[i] = Σ_j A_ij V_j 확인(O = A@V, (n,d_v) 모양). 논문 Eq.(1) alttext softmax(QK^T/√d_k)V와 같다.
  - field: para:15
    text: 논문은 이 연산에 "Scaled Dot-Product Attention"이라는 이름을 붙였다
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: We call our particular attention "Scaled Dot-Product Attention"
    note: 인용된 clm:intro-sdpa evidence와 같다(§3.2.1).
  - field: para:15
    text: query와 모든 key의 dot product를 √d_k로 나눈 뒤 softmax로 value의 가중치를 얻는다고 설명한다
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: We compute the dot products of the query with all keys, divide each by
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: and apply a softmax function to obtain the weights on the values.
    note: 두 구절 사이의 수식 alttext는 \sqrt{d_{k}}.
  - field: para:16
    text: '그림: Q와 K로 QKᵀ → ÷√d_k → 행별 softmax → A·V = O(V가 마지막 단계로 들어감)'
    verdict: computed
    note: 'SVG의 상자와 화살표를 읽어 흐름을 확인: Q,K→QKᵀ→÷√d_k→softmax(행)→A·V=O, V(점선)→A·V. 논문 Eq.(1)과 같은 순서다. 자체 제작 그림(origin: self-made)이라 저작권 문제 없음.'
  - field: para:17
    text: 점수 행렬은 n × m이라서 토큰 수의 제곱만큼 메모리를 쓴다
    verdict: computed
    note: 점수 행렬 원소 수 = n·m, self-attention(m = n)에서 n². n=1024 → 1,048,576개, n=2048 → 4,194,304개(4배). 교차 attention에서는 n·m이므로 '제곱'은 self-attention 기준이다(문단 13에서 m = n을 밝혀 두었으므로 통과). '행렬 모양만 맞추면 구현이 거의 끝난다'는 사실 서술이 아닌 안내 문장이다.
  - field: para:18
    text: </Section>
    verdict: no-claim
    note: ''
  - field: para:19
    text: <Section id=math> 제목 블록
    verdict: no-claim
    note: ''
  - field: para:20
    text: Attention(Q,K,V) = softmax(QK^T/√d_k) V
    verdict: computed
    note: 논문 HTML Eq.(1) alttext '\mathrm{Attention}(Q,K,V)=\mathrm{softmax}(\frac{QK^{T}}{\sqrt{d_{k}}})V'와 기호까지 같다(K^T 표기만 ⊤). numpy 구현 att(Q,K,V)=softmax_rows(Q@K.T/sqrt(dk))@V로 예제(문단 34) 값을 재현.
  - field: para:21
    text: Q, K, V는 query·key·value를 행으로 쌓은 행렬, d_k는 query와 key 벡터의 차원, softmax는 점수 행렬의 행마다 적용
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: In practice, we compute the attention function on a set of queries simultaneously, packed together into a matrix
    note: 행별 softmax는 각 query마다 key들에 대한 가중치를 만든다는 §3.2.1 설명('the weights on the values')과 맞다.
  - field: para:21
    text: softmax(z)_i = e^{z_i} / Σ_j e^{z_j}
    verdict: computed
    note: 정의대로 구현한 sm(z)로 z=[2,1,0] → [0.6652, 0.2447, 0.0900] (scipy와 같은 표준 정의).
  - field: para:22
    text: softmax 결과는 모두 양수이고 합이 1
    verdict: computed
