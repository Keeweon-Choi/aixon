  - field: para:10
    text: Multi-head attention은 query·key·value를 head마다 다른 학습된 행렬로 투영한 뒤 이 연산을 여러 개 나란히 돌린다
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: we found it beneficial to linearly project the queries, keys and values
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: On each of these projected versions of queries, keys and values we then perform the attention function in parallel, yielding
    note: round 2 재검증. 첫 구절은 'h times with different, learned linear projections'로 이어진다. 인용된 clm:scaled-dot-product-attention-part-of-multi-head-attention evidence와 같다.
  - field: para:10
    text: 결과를 이어 붙여 학습된 행렬 W^O로 한 번 더 투영한다
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: These are concatenated and once again projected, resulting in the final values, as depicted in Figure 2
    - url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/multihead-attention.html
      tier: B
      passage: attention-pooling outputs are concatenated and transformed with another learned linear projection to produce the final output.
    note: 'round 1 지적 사항 반영 확인. 논문 HTML alttext: ''MultiHead(Q,K,V) = Concat(head_1,...,head_h)W^{O}'', ''W^{O}\in\mathbb{R}^{hd_{v}\times d_{\text{model}}}''이고 ''Where the projections are parameter matrices''(학습되는 매개변수).'
  - field: para:10
