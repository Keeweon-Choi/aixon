- id: method:scaled-dot-product-attention
  reviewed_hash: baeb486b2395
  decision: approve
  checks:
  - field: name
    text: Scaled Dot-Product Attention
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: We call our particular attention "Scaled Dot-Product Attention" (Figure 2).
    note: ''
  - field: summary
    text: query와 key의 내적을 √d_k로 나눈 뒤 softmax로 가중치를 구해 value를 섞는 attention 연산
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: We compute the dot products of the query with all keys
    - url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html
      tier: B
      passage: regardless of vector length, we use the scaled dot product attention scoring function.
    note: Full sentence in §3.2.1 continues "divide each by sqrt(d_k), and apply a softmax function to obtain the weights on the values" (the divisor is math, so the passage stops before it).
  - field: summary
    text: Transformer의 기본 부품이다
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: On each of these projected versions of queries, keys and values we then perform the attention function in parallel
    note: Multi-head attention (used in every Transformer layer) runs scaled dot-product attention per head.
  - field: formula
    text: \mathrm{Attention}(Q,K,V)=\mathrm{softmax}\left(\frac{QK^{\top}}{\sqrt{d_k}}\right)V
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: 'We compute the matrix of outputs as:'
    note: 'Eq. (1) alttext in the v7 HTML: \mathrm{Attention}(Q,K,V)=\mathrm{softmax}(\frac{QK^{T}}{\sqrt{d_{k}}})V. Identical up to transpose notation (T vs \top).'
  - field: formula
    text: formula re-derived numerically
    verdict: computed
    sources: []
    note: 'numpy: Q(3x4),K(5x4),V(5x2) random; A=softmax(Q@K.T/sqrt(4))@V vs explicit per-query loop sum_j exp(q_i.k_j/2)/sum_l exp(q_i.k_l/2) * v_j -> np.allclose = True; rows of softmax(QK^T/sqrt(d_k)) sum to 1 -> True. Variance check: Var(q.k) for iid N(0,1) components = 4.0 (d_k=4), 64.49 (d_k=64), 508.16 (d_k=512), i.e. about d_k, consistent with footnote 4.'
  - field: aliases
    text: scaled dot-product attention
    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: We call our particular attention "Scaled Dot-Product Attention" (Figure 2).
    note: ''
  - field: aliases
    text: SDPA
    verdict: supported
    sources:
    - url: https://docs.pytorch.org/tutorials/intermediate/scaled_dot_product_attention_tutorial.html
      tier: C
      passage: At a high level, this PyTorch function calculates the scaled dot product attention (SDPA) between query, key, and value according to the definition found in the paper Attention is all you need.
    - url: https://huggingface.co/docs/transformers/v4.57.3/ko/model_doc/bert
      tier: C
      passage: Scaled Dot Product Attention(SDPA) 사용하기
    note: ''
  - field: classification
