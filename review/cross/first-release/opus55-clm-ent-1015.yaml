    verdict: supported
    sources:
    - url: https://arxiv.org/html/1706.03762v7
      tier: A
      passage: We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely.
    - url: https://www.ultralytics.com/ko/glossary/attention-mechanism
      tier: C
      passage: 어텐션 메커니즘은 쿼리, 키, 값을 사용해 관련성에 따라 입력 특징에 가중치를 부여합니다.
    note: The English term "attention mechanism" is used by the primary paper; the mixed Korean label matches Korean usage (어텐션 메커니즘).
  - field: summary
    text: 관련도 점수로 가중합을 만드는 신경망 구성 방식이다
    verdict: supported
    sources:
