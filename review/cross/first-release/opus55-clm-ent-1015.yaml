      tier: A
      passage: The output is computed as a weighted sum of the values, where the weight assigned to each value is computed by a compatibility function of the query with the corresponding key.
    - url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html
      tier: B
      passage: By design, the attention mechanism provides a differentiable means of control by which a neural network can select elements from a set and to construct an associated weighted sum over representations.
    note: compatibility function = 관련도 점수. D2L (textbook) treats it as a differentiable network mechanism.
  - field: summary
    text: 출력의 각 위치가 입력의 여러 위치를 서로 다른 비중으로 참고하도록
