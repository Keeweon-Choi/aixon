    verdict: computed
    sources: []
    note: 'Verified against src/islands/SoftmaxTemperatureLab.tsx and src/lib/lab/softmax.ts. T: range slider min=log(0.05), max=log(5), step="0.001" in log space, value=log(temperature), onChange exp(); number input min 0.05 max 5; useState(1) -> default 1, log scale (node: log(0.05)=-2.9957, log(5)=1.6094, exp back = 0.0500/5.0000). d_k: <select> options [1,4,16,64,256,512,1024], useState(64). n_keys: no control; sdpaStats(dk, 8, 1000, scaled, seed) hard-codes 8. seed: useState(42), number input with Number(v)||0; mulberry32 applies seed>>>0, so the effective seed is a uint32 0..4294967295 (node: 4294967296>>>0=0, -1>>>0=4294967295); step 1 because >>>0 truncates fractions. Note: the seed input itself has no min/max attributes; out-of-range values wrap rather than being rejected, which is consistent with the stated effective range.'
  - field: demonstrates
    text: concept:softmax, concept:softmax-temperature (explain)
    verdict: computed
    sources: []
    note: 'numpy softmax(z/T): z=[2,1,0] max prob T=1 -> 0.6652, T=0.1 -> 0.99995; z=[2,0], T=2 -> 0.7311 (= e^1/(e^1+1)). Lower T sharpens toward argmax, higher T flattens, which the T slider shows. Round 2: lib softmax(z,T) gives 0.6652, 0.99995, 0.7311 for the same inputs.'
