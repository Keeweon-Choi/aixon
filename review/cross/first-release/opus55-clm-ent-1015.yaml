    verdict: supported
    sources:
    - url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html
      tier: B
      passage: regardless of vector length, we use the scaled dot product attention scoring function.
    note: Section of the deep learning textbook D2L.
