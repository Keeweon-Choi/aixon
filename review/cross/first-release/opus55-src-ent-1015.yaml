  - field: parameters
    text: 'T: step 0.001, scale log'
    verdict: computed
    sources: []
    note: '구현: const logTemperature = (value) => Math.log(value); 슬라이더 min=log(0.05)=-2.996, max=log(5)=1.609, step="0.001"(로그 공간), 값은 Math.exp로 되돌림. 데이터의 scale log, step 0.001과 일치(step은 로그 공간 기준). 옆의 숫자 입력은 step="any".'
  - field: parameters
    text: 'd_k: min 1, max 1024, default 64, choices [1, 4, 16, 64, 256, 512, 1024]'
    verdict: computed
    sources: []
    note: '구현: <select> 선택지 [1, 4, 16, 64, 256, 512, 1024].map(...), useState(64). 선택지·최솟값·최댓값·기본값 모두 일치.'
  - field: parameters
    text: 'n_keys: min 8, max 8, step 1, default 8'
    verdict: computed
    sources: []
    note: 구현에 n_keys 컨트롤이 없고 sdpaStats(dk, 8, 1000, scaled, seed)로 8 고정. 데이터의 8..8 고정과 일치.
  - field: parameters
    text: 'seed: min 0, max 4294967295, step 1, default 42'
    verdict: computed
    sources: []
    note: '구현: useState(42), 숫자 입력(min/max 속성 없음, Number(...)||0). mulberry32가 seed>>>0 으로 32비트로 접으므로 유효 범위 0~2^32-1과 일치. 2**32-1=4294967295 확인.'
