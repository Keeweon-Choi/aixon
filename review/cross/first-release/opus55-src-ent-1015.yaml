    text: Attention(Q,K,V)=softmax(QK^T/√d_k)V
    verdict: computed
    sources: []
    note: 'numpy로 행렬식 softmax(QK^T/sqrt(d_k))V 와 원문 서술(각 query와 모든 key의 내적 -> sqrt(d_k)로 나눔 -> softmax -> value 가중합)을 n=3,m=4,d_k=5,d_v=2 무작위 행렬로 각각 계산: np.allclose(O_matrix, O_per_query)=True, 출력 모양 (3,2), softmax 행합=1. 원문 수식 alttext "\mathrm{Attention}(Q,K,V)=\mathrm{softmax}(\frac{QK^{T}}{\sqrt{d_{k}}})V" 와 기호 동일(K^T = K^\top).'
