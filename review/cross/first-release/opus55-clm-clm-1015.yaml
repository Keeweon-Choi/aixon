  - id: ai:lab-softmax-temp-01
    reviewed_hash: 2a8329962e66
    decision: approve
    checks:
      - field: prompt
        text: "z = [2, 1, 0]에서 T를 1에서 0.1로 낮추면 가장 큰 확률은?"
        verdict: computed
        sources: []
        note: "The prompt is well posed: the logits and both temperatures are given, and the scenario matches (logits [2,1,0], T_from 1, T_to 0.1). Own code: def sm(z,T): z=np.asarray(z,float)/T; e=np.exp(z-z.max()); return e/e.sum(). Result: sm([2,1,0],1).max()=0.6652409557748218, sm([2,1,0],0.1).max()=0.999954600070331."
      - field: answer
        text: "0 (커진다)"
        verdict: computed
        sources: []
        note: "0.66524 -> 0.99995, so the largest probability increases. Choices are indexed from 0: src/islands/SoftmaxTemperatureLab.tsx compares the radio value String(index) with Number(item.answer). So 0 means '커진다', which is correct."
      - field: choices
        text: "커진다 / 작아진다 / 그대로다"
        verdict: computed
        sources: []
        note: "Exactly one choice is correct. '작아진다' and '그대로다' are clearly wrong, since the value rises by 0.335. The repo reference (tools/gen_lab_fixtures.py, data/seed/lab_fixtures/softmax_temperature.json) gives the same numbers: p=[0.66524,0.24473,0.09003] at T=1 and [0.9999546,4.54e-05,2.06e-09] at T=0.1."
      - field: rationale
        text: "0.665 → 0.99995: 온도를 낮추면 분포가 argmax로 몰린다"
        verdict: computed
        sources: []
        note: "The rounding is correct: 0.66524 -> 0.665 and 0.9999546 -> 0.99995. The general statement follows from p_j/p_max = exp((z_j - z_max)/T), which goes to 0 as T -> 0+ for every j that is not the unique maximum. Here the ratios are exp(-10) and exp(-20) at T=0.1. So the distribution concentrates on the argmax, and the rationale matches the answer."
    unchecked: []
    fix: ""

  - id: ai:lab-softmax-temp-02
    reviewed_hash: 08febb51ac94
    decision: approve
    checks:
      - field: prompt
        text: "z = [2, 0], T = 2일 때 첫 번째 확률은?"
        verdict: computed
        sources: []
        note: "The prompt is well posed and matches the scenario (logits [2,0], T 2). Own code: sm([2,0],2)[0] = 0.7310585786300049, equal to e/(e+1)."
      - field: answer
        text: "0.731"
        verdict: computed
        sources: []
        note: "0.7310586 rounds to 0.731. The repo fixture gives p=[0.7310585786300049, 0.2689414213699951] for z=[2,0], T=2.0."
      - field: tolerance
        text: "0.005"
        verdict: computed
        sources: []
        note: "The accepted range is [0.726, 0.736], which covers 3-decimal rounding of the exact value. It rejects the typical mistakes: ignoring T gives e^2/(e^2+1)=0.8808; multiplying by T instead of dividing gives 0.9820 (in the fixture as T=0.5); taking 1/2 for the 'second' softmax gives 0.5. The tolerance is justified."
      - field: rationale
        text: "e¹/(e¹+1) ≈ 0.731"
        verdict: computed
        sources: []
        note: "z/T = [1, 0], so p_1 = e^1/(e^1+e^0) = e/(e+1) = 0.73106. The rationale is correct and matches the answer."
    unchecked: []
    fix: ""

