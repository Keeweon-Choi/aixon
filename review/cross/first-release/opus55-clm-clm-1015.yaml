  - id: clm:intro-additive-attention
    reviewed_hash: 6d46a79928cb
    decision: approve
    checks:
      - field: relation
        text: "Bahdanau 등 'Neural Machine Translation by Jointly Learning to Align and Translate' 논문이 Additive Attention을 제시한다"
        verdict: supported
        sources:
          - url: https://arxiv.org/html/1409.0473v7
            tier: A
            passage: 'as a feedforward neural network which is jointly trained with all the other components of the proposed system.'
          - url: https://arxiv.org/html/1706.03762v7
            tier: A
            passage: 'Additive attention computes the compatibility function using a feed-forward network with a single hidden layer.'
        note: "Bahdanau v7 §3.1 parametrizes the alignment (score) model as a feedforward network. Appendix A.1.2 says it uses 'a single-layer multilayer perceptron'. Bahdanau never uses the name 'additive attention'. The name comes later: Vaswani et al. (§3.2.1) write 'additive attention [2]', where reference [2] is Bahdanau, Cho, Bengio, 'Neural machine translation by jointly learning to align and translate', abs/1409.0473, and describe it as a feed-forward network with a single hidden layer. So the paper INTRODUCES the method now called additive attention. Direction is paper -> method."
      - field: evidence[0]
        text: 'In order to address this issue, we introduce an extension to the encoder–decoder model which learns to align and translate jointly.'
        verdict: supported
        sources:
          - url: https://arxiv.org/html/1409.0473v7
            tier: A
            passage: 'In order to address this issue, we introduce an extension to the encoder–decoder model which learns to align and translate jointly.'
        note: "Verbatim in v7 Introduction, paragraph 4. The fetched HTML's sha256 matches the packet (495bf11c...). The next sentences describe soft-searching source positions, which is the attention mechanism, and §3.1 gives its feedforward score function. The quote supports INTRODUCES in context, but on its own it does not show that the scoring is additive. Optional strengthening: add the §3.1 sentence 'We parametrize the alignment model as a feedforward neural network ...' as a second evidence."
    unchecked: []
    fix: ""

