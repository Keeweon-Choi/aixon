items:
  # ---------------------------------------------------------------- wiki
  - id: wiki:scaled-dot-product-attention
    kind: wiki
    recommendation: fix
    decision: fix
    publish: true   # decision이 approve일 때만 적용된다. 아래 fix를 반영한 뒤 decision을 approve로 바꾸면 승인과 공개가 함께 된다.
    checked: [support, direction, numbers, conditions, wording]
    notes: "모든 문장·수식·예제·그림·Cite를 1706.03762v7 §1–§4, 1409.0473v7 §1, 2010.11929v2 §1·§3, 2103.14030v2 §1·§3.2 원문과 lab fixture로 대조했고 verify 블록 3개는 통과한다. 필수 수정 3곳(L104 독립 가정 누락과 'We suspect'의 단정, L118·L219 0.9548을 0.96으로 반올림, L267 창 이동 설명)과 권장 수정 4곳이 있다."
    fix: |
      [필수 1] L104 (기초 단계 요약: 독립 가정이 빠졌고 논문의 추정을 사실처럼 씀)
        현재: query와 key의 성분이 평균 0, 분산 1이라고 가정하면 dot product의 분산은 $d_k$입니다. $d_k$가 크면 점수가 커지고, softmax가 한 key에 쏠려 기울기가 아주 작아집니다.
        변경: query와 key의 성분이 서로 독립이고 평균 0, 분산 1이라고 가정하면 dot product의 분산은 $d_k$입니다. 논문은 $d_k$가 크면 점수의 크기가 커져 softmax가 한 key에 쏠리고 기울기가 아주 작은 영역으로 밀려난다고 추정합니다(We suspect).
      [필수 2] L118, L219 (수치: fixture 0.9548, Lab 표시 0.9548, verify 0.9547 → 소수 둘째 자리는 0.95)
        L118 현재: $d_k = 512$에서는 약 0.96으로 거의 원-핫이 됩니다.
        L118 변경: $d_k = 512$에서는 약 0.95로 거의 원-핫이 됩니다.
        L219 현재: 평균 최대 가중치가 약 0.53에서 0.96으로 한 key에 몰립니다.
        L219 변경: 평균 최대 가중치가 약 0.53에서 0.95로 한 key에 몰립니다.
      [필수 3] L267 (Swin: 창을 '층마다' 옮기는 것이 아니라 연속한 두 블록에서 일반 창과 옮긴 창을 번갈아 쓴다(§3.2). 선형 비용은 창 분할에서 나온다(§1))
        현재: Swin Transformer는 이미지를 겹치지 않는 창으로 나눠 창 안에서만 attention을 계산하고<Cite claim="clm:swin-mitigates-quadratic" loc="Swin §1" />, 층마다 창을 어긋나게 옮겨 창 사이를 잇는 방식으로<Cite claim="clm:intro-shifted-window" loc="Swin §3.2" /> 계산량을 이미지 크기에 선형으로 줄였습니다.
        변경: Swin Transformer는 이미지를 겹치지 않는 창으로 나눠 창 안에서만 attention을 계산해, 창 크기가 고정이면 계산량이 이미지 크기에 선형이 되게 했습니다<Cite claim="clm:swin-mitigates-quadratic" loc="Swin §1" />. 창 사이는 연속한 두 블록에서 창 분할을 번갈아 바꿔(일반 창, 창 크기의 절반만큼 옮긴 창) 잇습니다<Cite claim="clm:intro-shifted-window" loc="Swin §3.2" />.
      [권장 4] L108 (유도 3번째 줄 '분산의 합'에는 성분 전체가 서로 독립이어야 함. 원문: components of q and k are independent)
        현재: query와 key의 성분 $q_i, k_i$가 서로 독립이고 평균 0, 분산 1이라고 가정하면:
        변경: query와 key의 모든 성분 $q_1,\dots,q_{d_k}, k_1,\dots,k_{d_k}$가 서로 독립이고 평균 0, 분산 1이라고 가정하면:
      [권장 5] L44 (MHA를 '같은 연산을 여러 번'으로 오해할 수 있음. §3.2.2: head마다 다른 학습된 투영 후 병렬 계산, 이어 붙임)
        현재: Multi-head attention</ConceptLink>은 이 연산을 여러 개 나란히 돌린 것이고
        변경: Multi-head attention</ConceptLink>은 query·key·value를 head마다 다른 학습된 행렬로 투영한 뒤 이 연산을 여러 개 나란히 돌리고 결과를 이어 붙인 것이고
      [권장 6] L276 (비교 대상이 빠짐. 원문: dot-product attention is much faster and more space-efficient [than additive])
        현재: 고도로 최적화된 행렬 곱셈 코드로 구현할 수 있어 실제로 더 빠르고 메모리를 덜 쓴다고 설명합니다
        변경: 고도로 최적화된 행렬 곱셈 코드로 구현할 수 있어 additive attention보다 실제로 더 빠르고 메모리를 덜 쓴다고 설명합니다
      [권장 7] L52 ('토큰이 n개'라고 한 뒤 key를 m개로 둠)
        현재: 토큰이 n개, query·key 차원이 $d_k$, value 차원이 $d_v$라고 합시다.
        변경: query가 n개, key·value가 m개, query·key 차원이 $d_k$, value 차원이 $d_v$라고 합시다.
      [선택] L37 "벡터의 길이(성분 개수)" → "벡터의 차원(성분 개수)", L214 "벡터 길이 d_k만" → "벡터 차원 d_k만" ('길이'는 노름으로 읽힐 수 있음).
      반영 후: verify 블록 재실행(숫자는 문장만 바뀌므로 assert 영향 없음), status/review는 approve-batch가 채운다.

  # ---------------------------------------------------------------- claims
  - id: clm:intro-sdpa
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, wording]
    notes: "1706.03762v7 §3.2.1 첫 문단 'We call our particular attention \"Scaled Dot-Product Attention\"'은 자기 기여로 제시한 진술이고 방향(논문→방법)도 맞다. 화면 문장 'Attention Is All You Need은(는) Scaled Dot-Product Attention을(를) 제시했다'는 정확하다(같은 절에서 스케일 외에는 기존 dot-product attention과 같다고 밝히므로 '최초 발명'으로 읽히지 않게 wiki L276이 보완한다)."
  - id: clm:sdpa-is-a-attention
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, wording]
    notes: "§3.2의 attention 함수 정의와 §3.2.1 'our particular attention'을 합치면 'SDPA는 일종의 attention 메커니즘이다'가 참이다. 방향(SDPA IS_A attention)과 화면 문장 모두 맞다."
  - id: clm:scaled-dot-product-attention-part-of-multi-head-attention
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, wording]
    notes: "Figure 2 캡션과 §3.2.2(head_i = Attention(QW_i^Q, KW_i^K, VW_i^V))를 보면 MHA를 설명하려면 SDPA를 부품으로 나열해야 한다. 두 번째 인용은 'yielding'에서 끊겨 있지만 대조에는 문제없다."
  - id: clm:multi-head-attention-part-of-transformer-encoder-layer
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, wording]
    notes: "§3.1 Encoder 문단 'The first is a multi-head self-attention mechanism'이 인코더 층의 첫 하위층임을 직접 말한다. 방향과 화면 문장이 맞다."
  - id: clm:transformer-encoder-layer-part-of-bert
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, wording]
    notes: "1810.04805v2 §3 Model Architecture 'multi-layer bidirectional Transformer encoder based on the original implementation'으로 BERT가 인코더 층을 쌓은 구조임이 확인된다."
  - id: clm:transformer-encoder-layer-part-of-vit
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, conditions, wording]
    notes: "2010.11929v2 §3.1 'The Transformer encoder ... consists of alternating layers of multiheaded self-attention and MLP blocks'로 확인된다. ViT는 LayerNorm을 블록 앞에 두는(pre-LN) 변형이지만 구성요소 관계는 그대로 성립한다."
  - id: clm:transformer-addresses-sequential
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, wording]
    notes: "§1 2문단(순차성이 학습 예제 안 병렬화를 막는다)과 4문단(recurrence를 버리고 attention에만 의존하는 Transformer를 제안)을 합치면 문제를 해결 대상으로 명시한 의도 진술이다. 화면 문장 '…문제를 다룬다'도 의도만 말해 정확하다."
  - id: clm:transformer-mitigates-sequential
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, numbers, wording]
    notes: "§4와 Table 1의 분석(self-attention 순차 연산 O(1), recurrent O(n))이 analytical_result로 완화 효과를 보인다. 인용이 'requires'에서 끊겨 있으나(뒤는 수식 O(n)) 의미 왜곡은 없다."
  - id: clm:intro-additive-attention
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, wording]
    notes: "1409.0473v7 §1 4문단 'we introduce an extension to the encoder–decoder model which learns to align and translate jointly'은 저자의 제안 진술이어서 INTRODUCES 판별 질문을 통과한다. '덧셈형 점수'라는 구체 근거는 §3.1 4문단 'We parametrize the alignment model a as a feedforward neural network …'(대조 도구로 found 확인)를 증거로 추가하면 더 단단하다(선택)."
  - id: clm:vit-adapts-transformer
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, conditions, wording]
    notes: "§1 3문단(NLP의 표준 Transformer를 최소한만 바꿔 이미지에 적용)과 §3 첫 문단(원 Transformer를 최대한 따른다)으로 from NLP → to CV 이동이 확인된다. 화면 문장 'Vision Transformer은(는) Transformer을(를) 적용했다'는 분야 qualifier를 보여 주지 않아 덜 구체적이지만 틀리지는 않는다."
  - id: clm:swin-mitigates-quadratic
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, conditions, wording]
    notes: "2103.14030v2 §1 3문단(S1.p3)에서 겹치지 않는 창 안의 self-attention으로 복잡도가 이미지 크기에 선형이 된다고 분석하고, §3.2 식 (1)(2)가 이를 뒷받침한다. 선형이 되는 조건(창 안 패치 수 고정)은 인용문 안에 들어 있다."
  - id: clm:intro-shifted-window
    kind: claim
    recommendation: approve
    decision: approve
    checked: [support, direction, wording]
    notes: "§3.2 3문단 'we propose a shifted window partitioning approach which alternates between two partitioning configurations in consecutive Swin Transformer blocks'는 직접적인 제안 진술이다. 단, 끝점 method:shifted-window-attention이 fix라서 그 엔티티가 승인되기 전에는 이 claim도 공개되지 않는다."

