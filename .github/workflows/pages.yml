name: Pages

# Builds the PUBLIC site (only human-approved content) and deploys it to GitHub Pages.
# Nothing here runs until someone triggers it or pushes to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PUBLIC_BASE: /${{ github.event.repository.name }}/
      PUBLIC_SITE: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: make build-public PUBLIC_BASE="$PUBLIC_BASE" PUBLIC_SITE="$PUBLIC_SITE"
      # Fails the deployment when anything unapproved or broken reached dist-public.
      - run: make check-dist-public PUBLIC_BASE="$PUBLIC_BASE" PUBLIC_SITE="$PUBLIC_SITE"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-public
      - id: deployment
        uses: actions/deploy-pages@v4
