name: Verify Online

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: make verify-online
      - uses: actions/upload-artifact@v4
        if: always() # keep the evidence when a check fails
        with:
          name: verification-online
          path: artifacts/verification/online/*.json
          if-no-files-found: error
