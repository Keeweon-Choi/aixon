# TEST FIXTURE — not real research data
# Deterministic graph for the AIXON site E2E and Python tests. Every title, quote and date below is
# made up; entity ids mirror the real seed only so that tests can share selectors.
# Validate with: .venv/bin/python tools/seedtool.py validate tests/fixtures/graph/site_graph.yaml
#
# Review coverage (the public-build gate depends on it):
#   clm:intro-transformer  human approval by human:fixture-editor  -> published in public builds
#   clm:intro-vit          "approval" by agent:fixture-bot          -> must NOT be published (trap)
#   every other claim      no review                                -> must NOT be published
schema_version: 1
graph:
  id: fixture-site
  name: AIXON site test fixture
  description: "(fixture) 사이트 E2E 테스트를 위한 작은 가짜 그래프. 연구 사실이 아니다."
  assumed_background:
    - "(fixture) 고등학교 대수"
  updated_at: '2026-10-15'

fields:
  - id: field:machine-learning
    name: 기계학습
    summary: "(fixture) 데이터에서 규칙을 학습하는 방법을 다루는 분야다."
    summary_by: agent:fixture-bot
    parents: []
  - id: field:deep-learning
    name: 딥러닝
    summary: "(fixture) 여러 층의 신경망으로 표현을 학습하는 분야다."
    summary_by: agent:fixture-bot
    parents:
      - field:machine-learning
  - id: field:computer-vision
    name: 컴퓨터 비전
    summary: "(fixture) 이미지와 영상을 이해하는 방법을 다루는 분야다."
    summary_by: agent:fixture-bot
    parents: []
  - id: field:vision-transformers
    name: 비전 트랜스포머
    summary: "(fixture) 이미지를 토큰열로 다루는 Transformer 계열을 다루는 분야다."
    summary_by: agent:fixture-bot
    parents:
      - field:computer-vision
      - field:deep-learning
  - id: field:natural-language-processing
    name: 자연어 처리
    summary: "(fixture) 사람의 언어를 계산으로 다루는 분야다."
    summary_by: agent:fixture-bot
    parents: []
  - id: field:machine-translation
    name: 기계 번역
    summary: "(fixture) 한 언어의 문장을 다른 언어로 옮기는 과제를 다루는 분야다."
    summary_by: agent:fixture-bot
    parents:
      - field:natural-language-processing

problems:
  - id: problem:sequential-computation
    name: 순차 계산의 병목
    summary: "(fixture) 시퀀스를 한 단계씩 순서대로 계산해야 해서 병렬화가 어려운 문제다."
    summary_by: agent:fixture-bot
    question: "(fixture) 시퀀스 처리의 순차 의존성을 어떻게 줄일 수 있는가?"
    fields:
      - field:natural-language-processing

concepts:
  - id: concept:dot-product
    name: 내적
    aliases:
      - dot product
    summary: "(fixture) 두 벡터의 대응 성분을 곱해 더한 값이다."
    summary_by: agent:fixture-bot
    dimensions:
      - recognize
      - explain
      - implement
    fields:
      - field:deep-learning
    formula: a\cdot b=\sum_i a_i b_i
    estimated_minutes:
      explain: 15
  - id: concept:softmax
    name: Softmax
    aliases:
      - 소프트맥스
    summary: "(fixture) 실수 벡터를 합이 1인 확률분포로 바꾸는 함수다."
    summary_by: agent:fixture-bot
    dimensions:
      - recognize
      - explain
      - derive
      - implement
    fields:
      - field:deep-learning
    formula: \mathrm{softmax}(z)_i=\frac{e^{z_i}}{\sum_j e^{z_j}}
    estimated_minutes:
      explain: 20
      derive: 25
  - id: concept:softmax-temperature
    name: Softmax 온도
    aliases:
      - softmax temperature
    summary: "(fixture) softmax 입력을 T로 나누어 분포의 뾰족한 정도를 조절하는 매개변수다."
    summary_by: agent:fixture-bot
    dimensions:
      - recognize
      - explain
      - derive
    fields:
      - field:deep-learning
    formula: p_i=\frac{e^{z_i/T}}{\sum_j e^{z_j/T}}
    estimated_minutes:
      explain: 20
  - id: concept:variance-of-sum
    name: 합의 분산
    aliases:
      - variance of sum
    summary: "(fixture) 독립 확률변수의 합의 분산은 각 분산의 합이라는 성질이다."
    summary_by: agent:fixture-bot
    dimensions:
      - recognize
      - explain
      - derive
    fields:
      - field:machine-learning
    estimated_minutes:
      explain: 20

methods:
  - id: method:scaled-dot-product-attention
    name: Scaled Dot-Product Attention
    aliases:
      - 스케일드 닷 프로덕트 어텐션
      - SDPA
    summary: "(fixture) query와 key의 내적으로 가중치를 만들어 value를 섞는 어텐션 연산이다."
    summary_by: agent:fixture-bot
    dimensions:
      - recognize
      - explain
      - derive
      - implement
    fields:
      - field:machine-translation
    formula: \mathrm{Attention}(Q,K,V)=\mathrm{softmax}\left(\frac{QK^{\top}}{\sqrt{d_k}}\right)V
    estimated_minutes:
      explain: 25
      derive: 30
  - id: method:multi-head-attention
    name: Multi-Head Attention
    aliases:
      - 멀티 헤드 어텐션
    summary: "(fixture) 어텐션을 여러 부분공간에서 나란히 계산해 합치는 구성이다."
    summary_by: agent:fixture-bot
    dimensions:
      - recognize
      - explain
      - implement
    fields:
      - field:machine-translation
    estimated_minutes:
      explain: 25

models:
  - id: model:transformer
    name: Transformer
    summary: "(fixture) 어텐션만으로 시퀀스를 변환하는 모델 계열이다."
    summary_by: agent:fixture-bot
    # The only entity whose AI summary a human approved: public builds may show it.
    summary_review:
      by: human:fixture-editor
      at: '2026-10-15'
      decision: approve
    dimensions:
      - recognize
      - explain
      - analyze
    fields:
      - field:machine-translation
    variants:
      - base
  - id: model:vit
    name: Vision Transformer
    aliases:
      - ViT
    summary: "(fixture) 이미지를 패치 토큰열로 바꿔 Transformer에 넣는 모델 계열이다."
    summary_by: agent:fixture-bot
    dimensions:
      - recognize
      - explain
      - analyze
    fields:
      - field:vision-transformers
    variants:
      - base
  - id: model:convnet
    name: ConvNet (fixture)
    summary: "(fixture) 합성곱 층을 쌓아 이미지 특징을 추출하는 모델 계열이다."
    summary_by: agent:fixture-bot
    dimensions:
      - recognize
      - explain
    fields:
      - field:computer-vision

