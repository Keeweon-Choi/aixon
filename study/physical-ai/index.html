<style>
:root{--bg:#edf3f2;--paper:#f9fcfb;--fg:#263534;--muted:#667775;--line:#c8d6d3;--accent:#b66a18;--accent-bg:#fff0da;--pass:#23735f;--progress:#a66b18;--empty:#6d7d7a;--code:#e4eeec;--danger:#a23f3f;--shadow:0 10px 28px rgba(31,55,51,.08)}

:root[data-theme="dark"]{--bg:#13201f;--paper:#1a2927;--fg:#e0e9e6;--muted:#a4b8b4;--line:#38504c;--accent:#f0b45b;--accent-bg:#342714;--pass:#73c5a8;--progress:#efbb69;--empty:#a4b8b4;--code:#243735;--danger:#ee9292;--shadow:0 10px 28px rgba(0,0,0,.2);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.65 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:hidden}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:.42rem .7rem}button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}a{color:var(--accent);overflow-wrap:anywhere}.shell{max-width:1280px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top .shell{padding-block:14px 10px}.brand{display:flex;justify-content:space-between;gap:16px;align-items:baseline}.brand h1{font-size:1.05rem;margin:0}.eyebrow,.mono,label,.status{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.76rem;letter-spacing:.02em}.tabs{display:flex;gap:4px;margin-top:10px}.tabs button[aria-selected="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}.banner{padding:7px 0;font-size:.86rem;color:var(--muted)}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-top:28px}.rail{border-right:1px solid var(--line);padding-right:16px}.rail button{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line);padding:10px 4px;background:transparent}.rail button[aria-current="true"]{color:var(--accent);font-weight:700}.rail small{display:block;color:var(--muted);margin-top:2px}.card,.next{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:20px}.next{border-left:4px solid var(--accent);box-shadow:var(--shadow)}.next h2,section h2{font-size:1.08rem;margin:0 0 10px}.stage-title{border-bottom:1px solid var(--line);padding-bottom:15px}.stage-title h2{margin:0;font-size:1.45rem}.stage-title p{margin:.55rem 0}.why{color:var(--muted)}section{margin:28px 0}section h3{font-size:1rem;margin:0 0 10px}.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.concept{border-left:2px solid var(--line);padding:4px 0 4px 10px}.concept b{display:block}.resource,.task,.check,.quiz{border-top:1px solid var(--line);padding:12px 0}.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.note{color:var(--muted);font-size:.9rem;margin:.3rem 0}.hint{font-size:.88rem;color:var(--muted);padding:10px 12px;background:var(--code);border-radius:7px}.progressbar{height:5px;background:var(--code);border-radius:8px;margin:7px 0 14px}.progressbar i{display:block;height:100%;background:var(--accent);border-radius:8px}.pass{color:var(--pass)}.inprogress{color:var(--progress)}.empty{color:var(--empty)}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}th{font-size:.8rem;color:var(--muted);font-family:"IBM Plex Mono",ui-monospace,monospace}pre.mermaid{overflow-x:auto;background:var(--paper);border:1px solid var(--line);padding:16px;border-radius:8px}textarea,input[type=text],input[type=number]{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px}textarea{min-height:80px}.note-editor{display:grid;gap:7px;margin-top:10px}.quiz fieldset{border:0;padding:0;margin:8px 0}.quiz label{display:block;margin:4px 0}.result{margin-top:7px;font-size:.9rem}.wrong{color:var(--danger)}.lab{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}.controls{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:9px;margin:10px 0}.controls label{font-size:.8rem}.chart{overflow-x:auto}.chart svg{min-width:620px;width:100%;height:auto;background:var(--code);border-radius:8px}.legend{font-size:.82rem;color:var(--muted)}.copyout{width:100%;min-height:140px;margin-top:10px}@media(max-width:680px){.layout{grid-template-columns:minmax(0,1fr);gap:16px}.rail{display:flex;overflow-x:auto;gap:4px;border-right:0;padding:0;min-width:0;max-width:100%}.rail button{min-width:142px;border:1px solid var(--line);border-radius:7px}.controls{grid-template-columns:repeat(2,1fr)}.row{flex-wrap:wrap}.brand{align-items:flex-start}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

<script type="application/json" id="content">{"meta":{"title":"Physical AI 공부 로드맵","source_url":"https://app.notion.com/p/3f96adcb5c5981b488f2ff60356a4634","fetched":"2026-10-15","intro":"처음 공부하는 사람도 따라올 수 있게 무엇을, 왜, 어떤 순서로, 무엇으로 배우는지 정리한 계획입니다. 단계마다 실제로 진행할 프로젝트와 맞물려 있어서, 공부한 것이 바로 결과물로 남습니다."},"overview":[{"stage":"기초","what":"컴퓨터비전 모델의 흐름: 백본 · 탐지 · 세그멘테이션 · 추적","why":"모든 단계의 바탕. CV 면접 단골 개념(IoU · NMS · anchor · mAP)","period":"1–2주"},{"stage":"0","what":"칼만 필터 · 다중 객체 추적(MOT)","why":"Smart Glass v2의 고스트 박스를 추적으로 바꾸기","period":"1주"},{"stage":"1","what":"Transformer → ViT → DETR","why":"깊이 모델 · ACT · VLM이 모두 이 구조 위에 있음","period":"1–2주"},{"stage":"2","what":"카메라 기하 → 깊이 추정 → 3D","why":"단안 깊이 3D 인지 프로젝트","period":"2주"},{"stage":"3","what":"로봇 기초: 좌표 변환 · ROS 2","why":"C++ 추론 + ROS 2 노드 프로젝트","period":"1–2주 (2단계와 병행 가능)"},{"stage":"4","what":"로봇 러닝 → ACT","why":"ACT 정책 양자화 프로젝트","period":"2–3주"},{"stage":"5","what":"VLM → VLA","why":"대학원 연구 방향, 스마트글래스 VLM 확장","period":"2주 이상 (읽기 위주)"}],"footnote":"기간은 하루 2–3시간 기준의 대략적인 권장치입니다. 프로젝트 일정에 맞춰 늘리거나 줄여도 됩니다.","diagram":"flowchart LR\n  B[\"기초. 컴퓨터비전 모델의 흐름\"] --> S0[\"0. 칼만 필터 · MOT\"]\n  B --> S1\n  S0 --> P1[\"Smart Glass v2\"]\n  S1[\"1. Transformer · ViT\"] --> S2[\"2. 카메라 기하 · 깊이 · 3D\"]\n  S2 --> P2[\"단안 깊이 3D 인지\"]\n  S3[\"3. 좌표 변환 · ROS 2\"] --> P3[\"C++ 추론 + ROS 2 노드\"]\n  S1 --> S4[\"4. 로봇 러닝 · ACT\"]\n  S4 --> P4[\"ACT 양자화\"]\n  S1 --> S5[\"5. VLM · VLA\"]\n  S4 --> S5","studyTips":{"reading":["처음 10분: 초록, 그림 1, 결과 표만 봅니다. \"무엇을 풀었고 얼마나 좋아졌나\"만 잡습니다.","두 번째: 방법의 큰 그림(모델 그림과 학습 방식)을 이해합니다. 수식은 건너뛰어도 됩니다.","세 번째: 직접 구현하거나 코드를 읽을 때 필요한 부분만 깊게 봅니다."],"noteTemplate":["1. 무엇을 풀었나:","2. 이전 방법은 왜 부족했나:","3. 핵심 아이디어 한 줄:","4. 실험으로 보여 준 것 (수치 하나):","5. 내 프로젝트에 쓸 점:"],"stuck":["개념이 안 잡히면 그림으로 설명한 글(아래 자료의 블로그·강의)부터 봅니다.","코드가 안 읽히면 입력과 출력의 텐서 모양(shape)부터 적어 봅니다.","하루 이상 막히면 다음 단계로 넘어갔다가 돌아옵니다. 순서보다 계속 진도가 나가는 게 중요합니다."]},"stages":[{"id":"b","label":"기초","title":"컴퓨터비전 모델의 흐름 (백본 · 탐지 · 세그멘테이션 · 추적)","summary":"모델 이름을 외우는 게 아니라 \"앞 모델의 어떤 문제를 다음 모델이 풀었나\"의 흐름을 잡습니다. 이미 써 본 모델(SSD, Faster R-CNN, YOLOX, YOLO11, BiSeNetV2 등)이 그 흐름의 어디에 있는지 알게 됩니다.","why":"뒤의 모든 단계가 이 위에 있고, CV 직무 면접에서 가장 자주 묻는 개념(IoU, NMS, anchor, mAP, FPN)이 여기에 다 들어 있습니다. 처음부터 완벽히 알 필요는 없고, 지도를 한 장 그려 두는 게 목표입니다.","prereqs":[],"flows":[{"branch":"백본 (특징 뽑기)","flow":"AlexNet → VGG → ResNet → MobileNet · EfficientNet → ViT · DINOv2","solved":"깊게 쌓기 → 깊어도 학습되게(잔차 연결) → 가볍게(엣지용) → Transformer로 넓게 보기"},{"branch":"2단계 탐지","flow":"R-CNN → Fast R-CNN → Faster R-CNN","solved":"후보 영역을 먼저 찾고 분류. 정확하지만 느림. Faster R-CNN은 후보 찾기도 신경망(RPN)으로"},{"branch":"1단계 탐지","flow":"YOLO v1 → SSD → RetinaNet → FCOS · YOLOX → YOLOv8–11","solved":"후보 단계 없이 한 번에(빠름) → 쉬운 배경에 덜 휘둘리게(focal loss) → anchor 없이 → 정답 박스 배정 방식 개선"},{"branch":"Transformer 탐지","flow":"DETR → RT-DETR","solved":"query마다 박스를 바로 예측, NMS가 필요 없음 → 실시간 속도로"},{"branch":"세그멘테이션","flow":"FCN → U-Net → DeepLab → BiSeNet · PP-LiteSeg","solved":"픽셀마다 분류 → 해상도 되살리기 → 넓은 문맥 보기 → 실시간용 구조"},{"branch":"추적","flow":"SORT → DeepSORT → ByteTrack → OC-SORT · BoT-SORT","solved":"칼만 + IoU → 외형 특징(ReID) 추가 → 낮은 점수 탐지 재활용 → 가림·카메라 움직임 보정"}],"concepts":[{"term":"백본 · 넥 · 헤드","desc":"특징을 뽑는 부분(백본), 여러 크기의 특징을 섞는 부분(넥, 예: FPN), 박스와 클래스를 내는 부분(헤드)."},{"term":"1단계와 2단계 탐지기","desc":"후보 영역을 먼저 고르고 분류하면 2단계(정확, 느림), 한 번에 박스와 클래스를 내면 1단계(빠름)."},{"term":"Anchor","desc":"미리 정해 둔 여러 크기·비율의 기준 박스. 모델은 \"이 기준 박스를 얼마나 옮기고 늘리면 물체에 맞나\"를 예측합니다. FCOS와 YOLOX는 anchor 없이 바로 예측합니다(anchor-free)."},{"term":"NMS","desc":"같은 물체에 겹쳐 나온 여러 박스 중 점수가 가장 높은 것만 남기는 후처리."},{"term":"FPN","desc":"깊은 층(의미는 강하지만 흐릿함)과 얕은 층(선명하지만 의미가 약함)을 섞어, 작은 물체와 큰 물체를 함께 잘 잡게 하는 구조."},{"term":"mAP","desc":"탐지 성능의 표준 지표. 클래스마다 정밀도-재현율 곡선 아래 면적(AP)을 구해 평균합니다. COCO의 AP(0.50:0.95)는 IoU 기준을 0.5부터 0.95까지 바꿔 가며 평균한 값입니다."}],"resources":[{"id":"r-b-1","title":"Lilian Weng, Object Detection Part 3: R-CNN Family","url":"https://lilianweng.github.io/posts/2017-12-31-object-recognition-part-3/","note":"2단계와 1단계 탐지기의 흐름을 그림으로. 가장 먼저.","paper":false},{"id":"r-b-2","title":"Part 4: Fast Detection Models","url":"https://lilianweng.github.io/posts/2018-12-27-object-recognition-part-4/","note":"2단계와 1단계 탐지기의 흐름을 그림으로. 가장 먼저.","paper":false},{"id":"r-b-3","title":"Dive into Deep Learning, 14장 Computer Vision","url":"https://d2l.ai/chapter_computer-vision/index.html","note":"anchor, SSD, R-CNN, 세그멘테이션을 코드와 함께 설명하는 무료 교재.","paper":false},{"id":"r-b-4","title":"Stanford CS231n","url":"https://cs231n.stanford.edu/","note":"강의 노트와 영상. 탐지·세그멘테이션 강의 위주로.","paper":false},{"id":"r-b-5","title":"ResNet","url":"https://arxiv.org/abs/1512.03385","note":"","paper":true},{"id":"r-b-6","title":"Faster R-CNN","url":"https://arxiv.org/abs/1506.01497","note":"","paper":true},{"id":"r-b-7","title":"YOLO v1","url":"https://arxiv.org/abs/1506.02640","note":"","paper":true},{"id":"r-b-8","title":"SSD","url":"https://arxiv.org/abs/1512.02325","note":"","paper":true},{"id":"r-b-9","title":"FPN","url":"https://arxiv.org/abs/1612.03144","note":"","paper":true},{"id":"r-b-10","title":"RetinaNet(Focal Loss)","url":"https://arxiv.org/abs/1708.02002","note":"","paper":true},{"id":"r-b-11","title":"FCOS","url":"https://arxiv.org/abs/1904.01355","note":"","paper":true},{"id":"r-b-12","title":"YOLOX","url":"https://arxiv.org/abs/2107.08430","note":"","paper":true},{"id":"r-b-13","title":"DeepSORT","url":"https://arxiv.org/abs/1703.07402","note":"","paper":true}],"tasks":[{"id":"t-b-1","text":"[ ] numpy로 IoU 계산 함수 직접 짜기"},{"id":"t-b-2","text":"[ ] numpy로 NMS 직접 짜기"},{"id":"t-b-3","text":"[ ] 탐지 결과와 정답으로 AP를 직접 계산해 보고 pycocotools 결과와 비교"},{"id":"t-b-4","text":"[ ] 이미 써 본 모델(SSD · Faster R-CNN · YOLOX · YOLO11 · BiSeNetV2)을 위 표의 어디에 놓을지 노트에 적기"}],"checks":[{"id":"c-b-1","text":"[ ] 1단계와 2단계 탐지기, anchor와 anchor-free의 차이를 설명할 수 있다","rubric":["2단계는 후보 영역을 먼저 고른 뒤 분류한다(정확하지만 느림). 1단계는 한 번에 박스와 클래스를 낸다(빠름).","anchor는 미리 정한 기준 박스이고, 모델은 그 박스를 얼마나 옮기고 늘릴지 예측한다.","anchor-free(FCOS, YOLOX)는 기준 박스 없이 바로 예측한다."]},{"id":"c-b-2","text":"[ ] NMS와 mAP를 계산하는 과정을 말로 설명할 수 있다","rubric":["NMS: 점수순 정렬 → 가장 높은 박스를 남김 → 그 박스와 IoU가 임계값을 넘는 박스 제거 → 남은 박스로 반복.","AP: 클래스마다 정밀도-재현율 곡선 아래 면적. mAP: 클래스 평균.","COCO AP(0.50:0.95): 여러 IoU 기준에서 구한 AP의 평균."]}],"quizzes":["q-b-iou","q-b-nms","q-b-map","q-b-lab-nms"],"lab":"iou-nms"},{"id":"s0","label":"0","title":"칼만 필터와 다중 객체 추적 (MOT)","summary":"탐지가 잠깐 끊겨도, 물체가 움직이던 방향과 속도로 다음 위치를 예측해 박스를 이어 가는 방법.","why":"Smart Glass는 추적이 느려서 \"마지막 탐지 결과를 그대로 유지\"(고스트 박스)했습니다. 그러면 고개를 돌릴 때 박스가 제자리에 남아 대상에서 어긋납니다. 칼만 필터는 연산이 아주 가벼워서 이 문제를 직접 풀 수 있습니다. 다만 카메라가 머리와 함께 움직이는 안경에서는 칼만만으로는 고스트가 줄지 않았고, 카메라 움직임 보정을 더해야 줄었습니다(Smart Glass v2 v0.1, 2026-10-14: 같은 4프레임 검출 간격에서 고스트 16.3% → 11.0%).","prereqs":["b"],"concepts":[{"term":"칼만 필터","desc":"\"예측\"과 \"측정\"을 섞는 방법. 직전 위치·속도로 지금 위치를 예측하고, 새 측정(탐지 박스)이 오면 둘을 믿을 만한 정도에 따라 섞어 보정합니다. 측정이 없으면 예측만으로 이어 갑니다."},{"term":"다중 객체 추적(MOT)","desc":"화면 속 여러 물체에 번호(ID)를 붙이고, 프레임이 바뀌어도 같은 물체에 같은 번호를 유지하는 일."},{"term":"짝짓기(association)","desc":"예측한 박스와 새로 탐지한 박스 중 어느 것이 같은 물체인지 정하는 단계. 박스가 얼마나 겹치는지(IoU)를 보고, 헝가리안 알고리즘으로 가장 잘 맞는 짝을 고릅니다."},{"term":"SORT","desc":"칼만 예측 + IoU 짝짓기만으로 만든 가장 단순하고 빠른 추적기."},{"term":"ByteTrack","desc":"확신이 낮은 탐지도 버리지 않고 두 번째 짝짓기에 써서, 가려진 물체를 덜 놓치는 추적기."},{"term":"카메라 움직임 보정(CMC)","desc":"카메라 자체가 움직이면(머리에 쓴 안경, 손에 든 폰) 화면 속 모든 물체가 함께 움직여 보여서, \"등속으로 움직인다\"는 칼만 예측이 빗나갑니다. 프레임 사이 화면 전체의 움직임(optical flow 등)을 먼저 구해 보정한 뒤 예측합니다. BoT-SORT가 이 방식을 씁니다."},{"term":"트랙 수명과 안내 대상 고르기 · 평가 지표","desc":"탐지가 끊긴 트랙을 예측만으로 몇 프레임까지 이어 갈지(SORT의 max_age), 새 트랙을 몇 번 확인해야 믿을지(min_hits)를 정합니다. 여러 트랙 중 안내할 하나를 고를 때 예측만으로 버티는 낡은 트랙을 막 검출된 트랙보다 앞세우면 고스트가 늘어납니다(Smart Glass v2에서 실제로 겪은 결함, 2026-10-14). IDF1(같은 물체에 같은 번호를 얼마나 잘 유지했나), HOTA(탐지와 연결을 함께 보는 종합 점수), ID switch(번호가 바뀐 횟수)."}],"resources":[{"id":"r-s0-1","title":"How a Kalman filter works, in pictures","url":"https://www.bzarg.com/p/how-a-kalman-filter-works-in-pictures/","note":"그림으로 보는 칼만 필터. 수식보다 이것부터.","paper":false},{"id":"r-s0-2","title":"SORT 논문","url":"https://arxiv.org/abs/1602.00763","note":"짧은 논문. 칼만 + IoU 짝짓기가 전부라는 걸 확인합니다.","paper":true},{"id":"r-s0-3","title":"ByteTrack 논문","url":"https://arxiv.org/abs/2110.06864","note":"\"낮은 점수 탐지를 다시 쓰기\" 하나만 이해하면 됩니다.","paper":true},{"id":"r-s0-4","title":"HOTA 논문","url":"https://arxiv.org/abs/2009.07736","note":"지표의 뜻과 계산 도구.","paper":true},{"id":"r-s0-5","title":"TrackEval","url":"https://github.com/JonathonLuiten/TrackEval","note":"지표의 뜻과 계산 도구.","paper":false}],"tasks":[{"id":"t-s0-1","text":"[ ] numpy로 1차원 칼만 필터(위치·속도)를 직접 구현하고, 노이즈 섞인 측정에서 예측선이 매끄러워지는지 그래프로 확인"},{"id":"t-s0-2","text":"[ ] 박스(중심 x, y, 크기)로 확장해 SORT를 따라 만들기"},{"id":"t-s0-3","text":"[ ] Smart Glass v2의 실험 E2(칼만 + IoU)에 그대로 쓰기"}],"checks":[{"id":"c-s0-1","text":"[ ] 고스트 박스와 칼만 추적의 차이를 말로 설명할 수 있다","rubric":["고스트 박스는 마지막 탐지 결과를 그대로 유지해서, 물체나 카메라가 움직이면 대상에서 어긋난다.","칼만 추적은 위치·속도로 다음 위치를 예측하고, 탐지가 오면 믿을 만한 정도에 따라 섞어 보정한다.","탐지가 없는 프레임에는 예측만으로 이어 간다."]},{"id":"c-s0-2","text":"[ ] IDF1과 ID switch가 무엇을 재는지 설명할 수 있다","rubric":["IDF1은 같은 물체에 같은 번호를 얼마나 잘 유지했는지 본다.","ID switch는 한 물체의 번호가 바뀐 횟수다.","(덧붙여) HOTA는 탐지와 연결을 함께 보는 종합 점수다."]},{"id":"c-s0-3","text":"[ ] 카메라가 움직일 때 칼만만으로 왜 부족한지, CMC가 그걸 어떻게 보정하는지 설명할 수 있다","rubric":["카메라가 움직이면 화면 속 모든 물체가 함께 움직여 보여 등속 예측이 빗나간다.","CMC는 프레임 사이 화면 전체의 움직임(optical flow 등)을 먼저 구해 보정한 뒤 예측한다.","BoT-SORT가 이 방식을 쓴다."]}],"quizzes":["q-0-gain","q-0-predict","q-0-cmc","q-0-lab-kf","q-0-lab-hold"],"lab":"kalman1d"},{"id":"s1","label":"1","title":"Transformer → ViT → DETR","summary":"요즘 거의 모든 비전·언어·로봇 모델의 공통 뼈대. 이미지를 작은 조각으로 잘라 \"단어\"처럼 다룹니다.","why":"2단계의 Depth Anything(이미지 인코더가 ViT), 4단계의 ACT(Transformer 인코더-디코더), 5단계의 VLM·VLA가 모두 이 구조 위에 있습니다. 한 번 배우면 세 곳에 씁니다.","prereqs":["b"],"concepts":[{"term":"토큰","desc":"모델이 다루는 조각 단위. 문장은 단어 조각, 이미지는 작은 사각형 조각(패치)으로 나눕니다."},{"term":"어텐션(attention)","desc":"각 토큰이 다른 모든 토큰을 얼마나 참고할지 스스로 정하는 방식. CNN이 가까운 픽셀만 보는 것과 달리 처음부터 이미지 전체를 봅니다."},{"term":"인코더 · 디코더","desc":"인코더는 입력을 이해한 표현으로 바꾸고, 디코더는 그 표현을 보며 출력을 만듭니다."},{"term":"ViT","desc":"이미지를 16×16 패치로 잘라 한 줄로 늘어놓고 Transformer 인코더에 넣는 분류 모델."},{"term":"DETR","desc":"탐지를 \"정해진 개수의 질문(query)에 답하기\"로 바꾼 Transformer 탐지기. 질문마다 박스 하나를 답해서 NMS가 필요 없습니다. ACT의 구조가 여기서 나왔습니다."}],"resources":[{"id":"r-s1-1","title":"The Illustrated Transformer","url":"https://jalammar.github.io/illustrated-transformer/","note":"그림으로 보는 Transformer. 가장 먼저.","paper":false},{"id":"r-s1-2","title":"Andrej Karpathy, Let's build GPT","url":"https://www.youtube.com/watch?v=kCc8FmEb1nY","note":"어텐션을 코드로 직접 짜 보는 강의(약 2시간).","paper":false},{"id":"r-s1-3","title":"Attention Is All You Need","url":"https://arxiv.org/abs/1706.03762","note":"원 논문. 1·2를 본 뒤 그림 1만 다시 이해하면 충분합니다.","paper":true},{"id":"r-s1-4","title":"ViT 논문","url":"https://arxiv.org/abs/2010.11929","note":"그림 1과 \"패치 임베딩\"이 핵심.","paper":true},{"id":"r-s1-5","title":"DETR 논문","url":"https://arxiv.org/abs/2005.12872","note":"object query와 \"집합 예측\"이 핵심.","paper":true}],"tasks":[{"id":"t-s1-1","text":"[ ] 작은 ViT를 직접 짜서 CIFAR-10 분류 학습 (RTX 3070으로 충분)"},{"id":"t-s1-2","text":"[ ] timm 라이브러리의 ViT 코드에서 패치 임베딩 부분 읽기"},{"id":"t-s1-3","text":"[ ] 공개된 DETR 가중치로 사진 몇 장을 탐지해 보고 YOLO 결과와 비교"}],"checks":[{"id":"c-s1-1","text":"[ ] 어텐션이 CNN과 무엇이 다른지 설명할 수 있다","rubric":["CNN은 가까운 픽셀(국소 영역)부터 보고 층을 쌓으며 넓혀 간다.","어텐션은 각 토큰이 다른 모든 토큰을 얼마나 참고할지 가중치로 정해, 첫 층부터 전체를 본다."]},{"id":"c-s1-2","text":"[ ] 이미지가 ViT에 들어가 토큰이 되는 과정을 텐서 모양으로 말할 수 있다","rubric":["(B, 3, 224, 224) 이미지를 16 × 16 패치 196개로 자른다.","패치 하나를 16·16·3 = 768 길이로 펼쳐 선형 투영 → (B, 196, D).","class token을 붙여 (B, 197, D), 위치 임베딩을 더해 인코더에 넣는다."]}],"quizzes":["q-1-patches","q-1-tokens","q-1-patchdim","q-1-attn"],"lab":null},{"id":"s2","label":"2","title":"카메라 기하 → 깊이 추정 → 3D","summary":"사진 한 장의 각 픽셀이 카메라에서 얼마나 떨어져 있는지 예측하고, 그걸 3D 점들(포인트클라우드)로 바꿉니다.","why":"로봇과 안경은 \"무엇이 있나\"뿐 아니라 \"얼마나 멀리, 어디에 있나\"를 알아야 움직일 수 있습니다. 단안 깊이 3D 인지 프로젝트의 바탕이고, 3D·센서 퓨전 채용 키워드로 이어집니다.","prereqs":["s1"],"concepts":[{"term":"핀홀 카메라 모델","desc":"3D 공간의 점이 작은 구멍을 지나 이미지 평면에 맺히는 방식. 3D → 2D 변환을 식 하나로 씁니다."},{"term":"내부 파라미터","desc":"초점거리, 이미지 중심 등 카메라 자체의 특성. 체커보드로 잴 수 있습니다(캘리브레이션)."},{"term":"외부 파라미터","desc":"카메라가 세상의 어디에, 어느 방향으로 있는지."},{"term":"역투영","desc":"픽셀 위치 + 깊이 → 3D 점. 이걸 모든 픽셀에 하면 포인트클라우드가 됩니다."},{"term":"상대 깊이와 절대 깊이","desc":"\"어느 쪽이 더 가깝나\"만 아는 것과 \"몇 미터인가\"까지 아는 것. 단안 모델은 대부분 상대 깊이라서 스케일을 따로 맞춰야 합니다."},{"term":"평가 지표","desc":"AbsRel(실제 거리 대비 평균 오차 비율), δ1(오차가 25% 안에 드는 픽셀 비율)."},{"term":"DPT · Depth Anything","desc":"ViT 인코더로 이미지를 이해하고, 여러 층의 특징을 합쳐 픽셀마다 깊이를 내는 모델."}],"resources":[{"id":"r-s2-1","title":"OpenCV 카메라 캘리브레이션 튜토리얼","url":"https://docs.opencv.org/4.x/dc/dbb/tutorial_py_calibration.html","note":"내부 파라미터를 직접 재 보며 개념 잡기.","paper":false},{"id":"r-s2-2","title":"Szeliski, Computer Vision: Algorithms and Applications (무료 온라인)","url":"https://szeliski.org/Book/","note":"2장(이미지 형성)과 12장(깊이 추정) 위주. 사전처럼 찾아봅니다.","paper":false},{"id":"r-s2-3","title":"Cyrill Stachniss 강의 (YouTube)","url":"https://www.youtube.com/@CyrillStachniss","note":"카메라 모델·SLAM 강의가 쉽고 정확합니다.","paper":false},{"id":"r-s2-4","title":"MiDaS","url":"https://arxiv.org/abs/1907.01341","note":"이 순서로 \"무엇이 나아졌나\"만 따라갑니다.","paper":true},{"id":"r-s2-5","title":"DPT","url":"https://arxiv.org/abs/2103.13413","note":"이 순서로 \"무엇이 나아졌나\"만 따라갑니다.","paper":true},{"id":"r-s2-6","title":"Depth Anything","url":"https://arxiv.org/abs/2401.10891","note":"이 순서로 \"무엇이 나아졌나\"만 따라갑니다.","paper":true},{"id":"r-s2-7","title":"Depth Anything V2","url":"https://arxiv.org/abs/2406.09414","note":"이 순서로 \"무엇이 나아졌나\"만 따라갑니다.","paper":true}],"tasks":[{"id":"t-s2-1","text":"[ ] 폰 카메라나 웹캠을 체커보드로 캘리브레이션"},{"id":"t-s2-2","text":"[ ] Depth Anything V2-Small로 내 사진의 깊이맵 만들기"},{"id":"t-s2-3","text":"[ ] 캘리브레이션 값으로 역투영해 포인트클라우드를 Open3D로 보기"},{"id":"t-s2-4","text":"[ ] KITTI 몇 장으로 AbsRel · δ1 계산해 보기 → 단안 깊이 3D 인지 프로젝트로 이어짐"}],"checks":[{"id":"c-s2-1","text":"[ ] 픽셀 하나를 3D 점으로 바꾸는 식을 손으로 쓸 수 있다","rubric":["X = (u − cx) · Z / fx","Y = (v − cy) · Z / fy","Z = 그 픽셀의 깊이"]},{"id":"c-s2-2","text":"[ ] 단안 깊이가 왜 실제 거리(스케일)를 모르는지 설명할 수 있다","rubric":["한 장의 사진에서는 장면을 k배 키우고 k배 멀리 두어도 같은 이미지가 된다(크기와 거리를 구분 못 함).","그래서 단안 모델은 대부분 상대 깊이를 내고, 절대 스케일은 다른 정보(알려진 크기, 카메라 높이, 다른 센서)로 맞춘다."]}],"quizzes":["q-2-project","q-2-backproject","q-2-scale"],"lab":null},{"id":"s3","label":"3","title":"로봇 기초: 좌표 변환과 ROS 2","summary":"카메라가 본 것을 로봇이 쓸 수 있는 좌표와 메시지로 바꾸는 법.","why":"인지 결과는 로봇 소프트웨어 안에서 다른 부품(계획·제어)이 받아 써야 의미가 있습니다. ROS 2는 그 부품들을 잇는 사실상의 표준이고, C++ 추론 + ROS 2 노드 프로젝트에 바로 쓰입니다.","prereqs":[],"concepts":[{"term":"좌표 변환","desc":"카메라 기준 좌표를 로봇 몸체 기준, 지도 기준으로 바꾸는 계산. 회전과 이동을 4×4 행렬 하나로 묶어 씁니다(동차 좌표)."},{"term":"ROS 2","desc":"로봇 프로그램을 작은 프로그램(노드)들로 나누고, 노드끼리 토픽으로 메시지를 주고받게 하는 틀."},{"term":"노드 · 토픽 · 메시지","desc":"노드는 일하는 단위, 토픽은 메시지가 오가는 채널, 메시지는 정해진 형식의 데이터(이미지, 점군 등)."},{"term":"rosbag","desc":"토픽에 오간 메시지를 녹화해 두었다가 그대로 재생하는 파일. 실제 로봇 없이 개발할 때 핵심입니다."},{"term":"tf","desc":"ROS 2에서 좌표 변환을 관리하는 기능."}],"resources":[{"id":"r-s3-1","title":"ROS 2 Humble 공식 튜토리얼","url":"https://docs.ros.org/en/humble/Tutorials.html","note":"Beginner의 CLI tools, Client libraries까지.","paper":false},{"id":"r-s3-2","title":"Modern Robotics (무료 교재·강의)","url":"http://hades.mech.northwestern.edu/index.php/Modern_Robotics","note":"3장(강체 운동)만 먼저. 동역학·제어는 개념만 봅니다.","paper":false}],"tasks":[{"id":"t-s3-1","text":"[ ] WSL2(Ubuntu 22.04)에 ROS 2 Humble 설치, 튜토리얼의 talker · listener 실행"},{"id":"t-s3-2","text":"[ ] 영상 파일을 이미지 토픽으로 바꿔 rosbag으로 녹화하고 재생"},{"id":"t-s3-3","text":"[ ] 이미지를 받아 흑백으로 바꿔 다시 내보내는 노드를 C++로 작성 → C++ 추론 + ROS 2 노드 프로젝트의 골격"}],"checks":[{"id":"c-s3-1","text":"[ ] 카메라 좌표의 점을 로봇 좌표로 바꾸는 변환을 설명할 수 있다","rubric":["회전 R과 이동 t를 4 × 4 동차 행렬 하나로 묶는다.","p_robot = R · p_cam + t (동차 좌표에서는 행렬 곱 한 번).","ROS 2에서는 tf가 이 변환들을 관리한다."]},{"id":"c-s3-2","text":"[ ] 노드 · 토픽 · bag의 관계를 그림으로 그릴 수 있다","rubric":["노드는 일하는 단위, 토픽은 메시지가 오가는 채널이다.","노드가 토픽에 메시지를 내보내고(publish) 다른 노드가 받는다(subscribe).","rosbag은 토픽에 오간 메시지를 녹화해 그대로 재생한다."]}],"quizzes":["q-3-transform","q-3-topic"],"lab":null},{"id":"s4","label":"4","title":"로봇 러닝 → ACT","summary":"사람이 로봇을 움직여 보인 시연을 보고, 카메라 영상만으로 같은 동작을 해내는 정책을 학습합니다.","why":"Physical AI에서 컴퓨터공학 전공자가 주도하는 핵심 영역입니다. 동역학 모델 없이 데이터와 학습으로 풀고, 지금까지 해 온 양자화·엣지 배포 경험을 \"정책 네트워크\"에 그대로 적용할 수 있습니다(ACT 양자화 프로젝트).","prereqs":["s1"],"concepts":[{"term":"정책(policy)","desc":"관측(카메라 영상, 관절 상태)을 받아 행동(관절 명령)을 내는 함수."},{"term":"행동 복제(Behavior Cloning)","desc":"시연 데이터의 (관측, 행동) 쌍으로 지도학습하는 가장 단순한 방법. 작은 실수가 쌓여 처음 보는 상황으로 흘러가는 문제(compounding error)가 있습니다."},{"term":"Action chunking","desc":"한 번에 한 동작이 아니라 앞으로의 k개 동작을 묶어서 예측. 실수가 덜 쌓이고 동작이 부드러워집니다. ACT의 핵심입니다."},{"term":"CVAE","desc":"같은 상황에서도 시연자마다 조금씩 다르게 움직이는 \"스타일\"을 따로 담아, 평균을 내다 동작이 흐려지는 걸 막는 생성 모델."},{"term":"Diffusion Policy","desc":"노이즈에서 시작해 여러 번 다듬어 행동을 만드는 방식. 정답 동작이 여러 개인 과제에 강합니다."},{"term":"성공률","desc":"로봇 정책의 기본 지표. 같은 과제를 N번 시켜 몇 번 성공했는지."}],"resources":[{"id":"r-s4-1","title":"ALOHA · ACT 프로젝트 페이지","url":"https://tonyzhaozh.github.io/aloha/","note":"영상으로 무엇을 하는지 먼저 봅니다.","paper":false},{"id":"r-s4-2","title":"ACT 논문","url":"https://arxiv.org/abs/2304.13705","note":"action chunking, temporal ensembling, CVAE 구조 그림.","paper":true},{"id":"r-s4-3","title":"Diffusion Policy","url":"https://diffusion-policy.cs.columbia.edu/","note":"ACT와 무엇이 다른지 비교하며 봅니다.","paper":false},{"id":"r-s4-4","title":"LeRobot 문서","url":"https://huggingface.co/docs/lerobot","note":"실습 도구. 시뮬레이션 환경(gym-pusht, gym-aloha)과 공개 데이터셋이 들어 있습니다.","paper":false},{"id":"r-s4-5","title":"GitHub","url":"https://github.com/huggingface/lerobot","note":"실습 도구. 시뮬레이션 환경(gym-pusht, gym-aloha)과 공개 데이터셋이 들어 있습니다.","paper":false}],"tasks":[{"id":"t-s4-1","text":"[ ] LeRobot을 설치하고 공개 데이터셋으로 ACT 학습 예제 실행 (ACT 학습은 GPU 메모리 2–6GB 정도로 알려져 있음)"},{"id":"t-s4-2","text":"[ ] 시뮬레이션에서 성공률을 재고 기록"},{"id":"t-s4-3","text":"[ ] 학습된 정책을 ONNX로 내보내 추론 속도 재기 → ACT 양자화 프로젝트(FP16·INT8에서 성공률이 어떻게 변하나)로 이어짐"}],"checks":[{"id":"c-s4-1","text":"[ ] 행동 복제의 누적 오류 문제와, action chunking이 그걸 어떻게 줄이는지 설명할 수 있다","rubric":["행동 복제는 작은 실수가 쌓여 시연에 없던 상황으로 흘러가는 누적 오류 문제가 있다.","action chunking은 앞으로의 k개 동작을 묶어 예측해, 결정 횟수를 줄이고 실수가 덜 쌓이게 한다.","동작도 더 부드러워진다."]},{"id":"c-s4-2","text":"[ ] ACT의 입력과 출력을 텐서 모양으로 말할 수 있다","rubric":["입력: 카메라 영상(여러 대일 수 있음) + 관절 상태.","출력: k개 시점의 행동 묶음, 즉 (k, 관절 수) 모양.","학습 때는 CVAE가 시연 스타일을 따로 담는다."]}],"quizzes":["q-4-chunk","q-4-bc"],"lab":null},{"id":"s5","label":"5","title":"VLM → VLA","summary":"이미지와 글을 함께 이해하는 모델(VLM)에 \"행동\" 출력을 붙이면, 말로 시킨 일을 보고 이해하고 움직이는 모델(VLA)이 됩니다.","why":"로봇 분야에서 가장 빠르게 움직이는 흐름이고, 대학원 연구 방향(온디바이스 VLA 추론)과 스마트글래스의 VLM 확장에 직접 이어집니다. 다만 큰 모델은 RTX 3070(8GB)으로 미세조정하기 어려워 읽기와 작은 실습 위주로 합니다.","prereqs":["s1","s4"],"concepts":[{"term":"CLIP","desc":"이미지와 글을 같은 공간에 놓고 \"이 사진에 맞는 설명\"을 고르게 학습한 모델. 학습하지 않은 클래스도 이름만으로 분류할 수 있습니다(zero-shot)."},{"term":"VLM","desc":"이미지 인코더(대개 ViT) + 연결층 + 대형 언어 모델. 사진을 보고 질문에 글로 답합니다(LLaVA 등)."},{"term":"VLA","desc":"VLM이 글 대신 로봇 행동을 출력하게 만든 모델(RT-2, OpenVLA, π0, SmolVLA)."},{"term":"행동을 내는 방법","desc":"행동을 숫자 토큰으로 바꿔 글처럼 생성하거나(RT-2, OpenVLA), 행동 전용 출력부를 따로 붙입니다(π0, SmolVLA)."},{"term":"엣지 문제","desc":"VLA는 수십억 파라미터라 로봇 위에서 느립니다. 양자화·경량화·비동기 실행이 활발한 연구 주제이고, 지금까지의 경험과 가장 가까운 지점입니다."},{"term":"환각(hallucination)","desc":"VLM은 화면에 없는 것도 있다고 답합니다. Smart Glass v2에서 Qwen3-VL-2B는 \"보이지 않으면 null\" 선택지를 줘도 249번 중 한 번도 고르지 않았습니다(2026-10-14). 그래서 VLM이 제안하고 검출기 · 추적이 확인한 것만 안내하는 검증 경로를 둡니다. \"보이나?\"를 먼저 묻는 두 단계 질문만으로도 목표가 없는데 있다고 한 답이 26번 중 26번에서 7번으로 줄었고, 트랙 확인까지 더하면 안내한 것 중 틀린 것은 7%였습니다(대신 질문의 절반쯤은 안내하지 않음)."}],"resources":[{"id":"r-s5-1","title":"Hugging Face, Vision Language Models Explained","url":"https://huggingface.co/blog/vlms","note":"VLM 개요를 쉽게.","paper":false},{"id":"r-s5-2","title":"CLIP","url":"https://arxiv.org/abs/2103.00020","note":"VLM의 기본 두 편.","paper":true},{"id":"r-s5-3","title":"LLaVA","url":"https://arxiv.org/abs/2304.08485","note":"VLM의 기본 두 편.","paper":true},{"id":"r-s5-4","title":"RT-2","url":"https://arxiv.org/abs/2307.15818","note":"행동을 내는 방식이 어떻게 바뀌었나 따라갑니다.","paper":true},{"id":"r-s5-5","title":"OpenVLA","url":"https://arxiv.org/abs/2406.09246","note":"행동을 내는 방식이 어떻게 바뀌었나 따라갑니다.","paper":true},{"id":"r-s5-6","title":"π0","url":"https://arxiv.org/abs/2410.24164","note":"행동을 내는 방식이 어떻게 바뀌었나 따라갑니다.","paper":true},{"id":"r-s5-7","title":"SmolVLA","url":"https://arxiv.org/abs/2506.01844","note":"행동을 내는 방식이 어떻게 바뀌었나 따라갑니다.","paper":true}],"tasks":[{"id":"t-s5-1","text":"[ ] CLIP으로 내 사진을 zero-shot 분류해 보기"},{"id":"t-s5-2","text":"[ ] 작은 VLM(SmolVLM, Moondream 등)을 PC에서 돌려 사진에 질문해 보고 응답 시간 재기"},{"id":"t-s5-3","text":"[ ] OpenVLA나 SmolVLA의 구조 그림을 보고 어디를 양자화하면 좋을지 메모 → ACT 양자화 다음 단계 후보"}],"checks":[{"id":"c-s5-1","text":"[ ] VLM과 VLA의 차이를 한 문장으로 말할 수 있다","rubric":["VLM은 이미지와 글을 받아 글로 답한다.","VLA는 같은 이해를 바탕으로 로봇 행동을 출력한다."]},{"id":"c-s5-2","text":"[ ] VLA를 로봇 위에서 돌리기 어려운 이유를 숫자(파라미터 수, 메모리)로 설명할 수 있다","rubric":["VLA는 수십억 파라미터라 FP16에서 7B 기준 가중치만 약 14 GB다.","8 GB GPU나 로봇 보드에는 그대로 올라가지 않아 INT4 등 양자화(7B → 약 3.5 GB)와 경량화가 필요하다.","추론 지연도 커서 비동기 실행 같은 방법을 쓴다."]}],"quizzes":["q-5-fp16","q-5-int4","q-5-vla"],"lab":null}],"glossary":[{"term":"백본 · 넥 · 헤드","desc":"특징을 뽑는 부분, 여러 크기의 특징을 섞는 부분, 박스와 클래스를 내는 부분"},{"term":"Anchor","desc":"미리 정해 둔 기준 박스. 모델은 이 박스를 얼마나 옮기고 늘릴지 예측함"},{"term":"NMS","desc":"겹친 박스들 중 점수가 가장 높은 것만 남기는 후처리"},{"term":"FPN","desc":"깊은 층과 얕은 층의 특징을 섞어 큰 물체와 작은 물체를 함께 잡는 구조"},{"term":"mAP","desc":"탐지 성능 지표. 클래스별 정밀도-재현율 곡선 아래 면적의 평균"},{"term":"칼만 필터","desc":"예측과 측정을 믿을 만한 정도에 따라 섞어 위치를 추정하는 방법"},{"term":"MOT","desc":"여러 물체에 번호를 붙여 프레임이 바뀌어도 같은 번호를 유지하는 일"},{"term":"IoU","desc":"두 박스가 겹치는 면적 ÷ 두 박스를 합친 면적. 1이면 완전히 같음"},{"term":"IDF1 · HOTA","desc":"추적이 같은 물체에 같은 번호를 얼마나 잘 유지했는지 보는 점수"},{"term":"토큰 · 패치","desc":"모델이 다루는 조각. 이미지에서는 작은 사각형 조각(패치)"},{"term":"어텐션","desc":"각 조각이 다른 조각을 얼마나 참고할지 스스로 정하는 계산"},{"term":"인코더 · 디코더","desc":"입력을 이해하는 부분과, 그 이해를 보고 출력을 만드는 부분"},{"term":"ViT","desc":"이미지를 패치로 잘라 Transformer에 넣는 모델"},{"term":"DETR","desc":"정해진 개수의 질문(query)마다 박스 하나를 답하는 Transformer 탐지기"},{"term":"내부 · 외부 파라미터","desc":"카메라 자체의 특성(초점거리 등)과, 카메라의 위치·방향"},{"term":"역투영","desc":"픽셀 위치와 깊이로 3D 점을 계산하는 것"},{"term":"포인트클라우드","desc":"3D 점들의 모음. LiDAR나 깊이 추정으로 얻음"},{"term":"AbsRel · δ1","desc":"깊이 추정의 오차 비율, 그리고 오차가 25% 안에 드는 픽셀 비율"},{"term":"노드 · 토픽 · rosbag","desc":"ROS 2의 일하는 단위, 메시지 채널, 메시지 녹화 파일"},{"term":"정책","desc":"관측을 받아 행동을 내는 함수"},{"term":"행동 복제","desc":"사람의 시연을 지도학습으로 따라 하는 방법"},{"term":"Action chunk","desc":"앞으로의 여러 동작을 한 번에 묶어 예측한 것"},{"term":"CVAE","desc":"같은 상황의 여러 가능한 동작(스타일)을 따로 담는 생성 모델"},{"term":"Zero-shot","desc":"학습하지 않은 대상을 이름이나 설명만으로 맞히는 것"},{"term":"VLM · VLA","desc":"이미지와 글을 이해해 글로 답하는 모델, 그리고 행동까지 내는 모델"},{"term":"양자화","desc":"모델의 숫자 정밀도를 낮춰(FP32 → FP16 · INT8) 빠르고 가볍게 만드는 것"}],"quizzes":[{"id":"q-b-iou","stage":"b","kind":"numeric","prompt":"박스 A = (0, 0, 4, 4), 박스 B = (2, 2, 6, 6)이다(x1, y1, x2, y2). IoU는? (소수 셋째 자리까지)","answer":0.143,"tolerance":0.002,"explanation":"교집합은 2 × 2 = 4, 합집합은 16 + 16 − 4 = 28, IoU = 4 / 28 ≈ 0.143."},{"id":"q-b-nms","stage":"b","kind":"mcq","prompt":"점수가 0.9와 0.8인 두 박스의 IoU가 0.6이고 NMS 임계값이 0.5일 때 결과는?","choices":["두 박스 모두 남는다","0.8 박스가 제거된다","0.9 박스가 제거된다","두 박스가 하나로 합쳐진다"],"answer":1,"explanation":"점수가 높은 0.9 박스를 먼저 남기고, 그 박스와 IoU가 임계값(0.5)보다 큰 0.8 박스를 제거한다."},{"id":"q-b-map","stage":"b","kind":"mcq","prompt":"COCO의 AP(0.50:0.95)는 무엇을 평균한 값인가?","choices":["IoU 기준을 0.50부터 0.95까지 바꿔 가며 구한 AP","점수 임계값 0.50부터 0.95까지에서 구한 정밀도","클래스 50개부터 95개까지의 AP","IoU 0.50과 0.95 두 기준에서의 재현율"],"answer":0,"explanation":"클래스별 AP(정밀도-재현율 곡선 아래 면적)를 여러 IoU 기준(0.50~0.95)에서 구해 평균한다."},{"id":"q-b-lab-nms","stage":"b","kind":"lab_prediction","lab":"iou-nms","scenario":{"threshold_from":0.3,"threshold_to":0.7},"prompt":"실습의 박스 6개에 NMS를 적용할 때, 임계값을 0.3에서 0.7로 올리면 남는 박스 수는?","choices":["늘어난다","줄어든다","같다"],"answer":0,"explanation":"임계값이 높을수록 많이 겹쳐야 제거되므로 덜 제거된다. 이 예시에서는 2개(b1, b4)에서 6개로 늘어난다."},{"id":"q-0-gain","stage":"s0","kind":"numeric","prompt":"1차원 칼만 필터에서 예측 분산 P⁻ = 4, 측정 분산 R = 1일 때 칼만 이득 K = P⁻ / (P⁻ + R)은?","answer":0.8,"tolerance":0.001,"explanation":"K = 4 / (4 + 1) = 0.8. 측정 쪽을 80%, 예측 쪽을 20% 믿어 섞는다."},{"id":"q-0-predict","stage":"s0","kind":"mcq","prompt":"탐지가 끊긴 프레임에서 칼만 필터는 어떻게 하나?","choices":["예측 단계만 수행해 위치를 이어 가고, 불확실성(P)은 커진다","마지막 측정값을 그대로 유지한다","트랙을 즉시 삭제한다","속도를 0으로 바꾼다"],"answer":0,"explanation":"측정이 없으면 보정 없이 예측만으로 이어 간다. 그만큼 추정의 불확실성은 커진다."},{"id":"q-0-cmc","stage":"s0","kind":"mcq","prompt":"머리에 쓴 카메라가 움직일 때 칼만 필터만으로는 고스트가 잘 줄지 않는 이유는?","choices":["카메라가 움직이면 화면 속 물체의 움직임이 등속 예측과 어긋나기 때문","칼만 필터는 사람을 추적할 수 없기 때문","IoU 계산이 느려지기 때문","측정 잡음이 0이 되기 때문"],"answer":0,"explanation":"화면 전체가 카메라와 함께 움직여 등속 가정이 빗나간다. 그래서 프레임 사이 전체 움직임을 먼저 보정(CMC)한다."},{"id":"q-0-lab-kf","stage":"s0","kind":"lab_prediction","lab":"kalman1d","scenario":{"interval":4,"sigma_z":2,"sigma_a":0.05,"seed":7},"prompt":"검출 간격 N = 4(4프레임마다 한 번 검출)에서 RMSE가 더 작은 방식은?","choices":["마지막 검출 유지(고스트)","칼만 필터","거의 같다"],"answer":1,"explanation":"이 시나리오(seed 7, 60프레임)에서 마지막 검출 유지는 3.07, 칼만 필터는 1.91이다. 칼만은 검출이 없는 프레임에도 속도로 위치를 이어 간다."},{"id":"q-0-lab-hold","stage":"s0","kind":"lab_prediction","lab":"kalman1d","scenario":{"interval":1,"sigma_z":2,"sigma_a":0.05,"seed":7},"prompt":"매 프레임 검출(N = 1)일 때, 마지막 검출 유지 방식의 RMSE는 대략 무엇과 비슷한가?","choices":["측정 잡음의 크기 σ_z (약 2)","0","물체의 속도 (1.2)","검출 간격 (1)"],"answer":0,"explanation":"매 프레임 측정값을 그대로 쓰므로 오차는 측정 잡음 수준이다(이 시나리오 2.19). 칼만은 측정을 매끄럽게 섞어 0.72까지 줄인다."},{"id":"q-1-patches","stage":"s1","kind":"numeric","prompt":"224 × 224 이미지를 16 × 16 패치로 자르면 패치는 몇 개인가?","answer":196,"tolerance":0,"explanation":"(224 / 16)² = 14² = 196."},{"id":"q-1-tokens","stage":"s1","kind":"numeric","prompt":"ViT에서 위 196개 패치 앞에 class token 하나를 붙이면 인코더에 들어가는 토큰은 몇 개인가?","answer":197,"tolerance":0,"explanation":"196 + 1 = 197."},{"id":"q-1-patchdim","stage":"s1","kind":"numeric","prompt":"RGB 16 × 16 패치 하나를 한 줄로 펼친 벡터의 길이는?","answer":768,"tolerance":0,"explanation":"16 × 16 × 3 = 768. 이 벡터를 선형 투영해 패치 임베딩을 만든다."},{"id":"q-1-attn","stage":"s1","kind":"mcq","prompt":"어텐션이 CNN의 합성곱과 가장 크게 다른 점은?","choices":["각 토큰이 처음부터 모든 토큰을 얼마나 참고할지 가중치로 정한다(전역)","가까운 픽셀만 본다(국소)","가중치를 학습하지 않는다","이미지에서만 쓸 수 있다"],"answer":0,"explanation":"합성곱은 가까운 픽셀부터 보지만, 어텐션은 첫 층부터 모든 토큰 사이의 관계를 계산한다."},{"id":"q-2-project","stage":"s2","kind":"numeric","prompt":"fx = fy = 500, cx = 320, cy = 240인 카메라가 있다. 카메라 좌표 (X, Y, Z) = (0.4, −0.2, 2.0) m인 점은 픽셀 u가 얼마인 곳에 찍히나?","answer":420,"tolerance":0.5,"explanation":"u = fx · X / Z + cx = 500 × 0.4 / 2.0 + 320 = 420. (v = 500 × (−0.2) / 2.0 + 240 = 190)"},{"id":"q-2-backproject","stage":"s2","kind":"numeric","prompt":"같은 카메라에서 픽셀 (u, v) = (420, 190), 깊이 Z = 2.0 m일 때 X는 몇 m인가?","answer":0.4,"tolerance":0.001,"explanation":"X = (u − cx) · Z / fx = 100 × 2.0 / 500 = 0.4."},{"id":"q-2-scale","stage":"s2","kind":"mcq","prompt":"카메라 한 대로 찍은 사진만으로는 실제 거리(스케일)를 알 수 없는 이유는?","choices":["장면 전체를 k배 키우고 k배 멀리 두어도 같은 이미지가 찍혀 한 장으로는 구분할 수 없기 때문","모델의 해상도가 낮기 때문","깊이 값이 항상 음수이기 때문","외부 파라미터가 항상 0이기 때문"],"answer":0,"explanation":"크기와 거리가 함께 바뀌면 투영 결과가 같다. 그래서 단안 모델은 대부분 상대 깊이를 내고, 스케일은 다른 정보로 맞춘다."},{"id":"q-3-transform","stage":"s3","kind":"numeric","prompt":"카메라 좌표의 점 (1, 0, 0)을 p_robot = R · p_cam + t로 로봇 좌표로 바꾼다. R은 z축 기준 90° 회전, t = (0.5, 0, 0.2)일 때 로봇 좌표의 y는?","answer":1,"tolerance":0.001,"explanation":"z축 90° 회전은 (1, 0, 0)을 (0, 1, 0)으로 돌린다. t를 더하면 (0.5, 1, 0.2)."},{"id":"q-3-topic","stage":"s3","kind":"mcq","prompt":"ROS 2에서 카메라 노드가 이미지를 보내고 탐지 노드가 받는 채널을 무엇이라 하나?","choices":["토픽","노드","rosbag","tf"],"answer":0,"explanation":"노드는 일하는 단위, 토픽은 메시지가 오가는 채널, rosbag은 토픽 메시지 녹화 파일, tf는 좌표 변환 관리."},{"id":"q-4-chunk","stage":"s4","kind":"numeric","prompt":"제어 주기가 50 Hz이고 action chunk 크기가 100이면, 한 번 예측한 행동은 몇 초 분량인가?","answer":2,"tolerance":0.001,"explanation":"100 / 50 Hz = 2초."},{"id":"q-4-bc","stage":"s4","kind":"mcq","prompt":"행동 복제의 누적 오류(compounding error)란?","choices":["작은 실수가 쌓여 시연에 없던 상황으로 흘러가 더 큰 실수를 하게 되는 문제","학습 데이터가 너무 많아서 생기는 문제","GPU 메모리가 부족해지는 문제","보상 함수를 잘못 설계해서 생기는 문제"],"answer":0,"explanation":"정책의 작은 오차가 다음 관측을 시연 분포 밖으로 밀어내고, 그곳에서 더 크게 틀린다."},{"id":"q-5-fp16","stage":"s5","kind":"numeric","prompt":"파라미터 70억 개(7B) 모델을 FP16(파라미터당 2바이트)으로 올리면 가중치만 몇 GB(10⁹ 바이트)인가?","answer":14,"tolerance":0.01,"explanation":"7 × 10⁹ × 2바이트 = 14 × 10⁹바이트 = 14 GB. RTX 3070(8 GB)에는 들어가지 않는다."},{"id":"q-5-int4","stage":"s5","kind":"numeric","prompt":"같은 7B 모델을 INT4(파라미터당 0.5바이트)로 양자화하면 가중치는 몇 GB인가?","answer":3.5,"tolerance":0.01,"explanation":"7 × 10⁹ × 0.5바이트 = 3.5 GB."},{"id":"q-5-vla","stage":"s5","kind":"mcq","prompt":"VLM과 VLA의 차이로 맞는 것은?","choices":["VLA는 VLM에 로봇 행동 출력을 붙여, 보고 지시를 이해해 움직인다","VLA는 이미지를 쓰지 않는다","VLM은 행동을 내고 VLA는 글을 낸다","둘은 같은 말이다"],"answer":0,"explanation":"VLM은 이미지와 글을 받아 글로 답하고, VLA는 같은 이해를 바탕으로 행동을 낸다."}],"labs":{"iou-nms":{"stage":"b","nms_preset":[{"id":"b1","box":[10,10,40,50],"score":0.92},{"id":"b2","box":[14,12,44,52],"score":0.85},{"id":"b3","box":[20,18,50,58],"score":0.6},{"id":"b4","box":[60,30,90,70],"score":0.88},{"id":"b5","box":[63,34,93,74],"score":0.7},{"id":"b6","box":[55,25,85,65],"score":0.55}],"expected":{"iou_pairs":{"b1-b2":0.6997,"b1-b3":0.3636,"b2-b3":0.5152,"b4-b5":0.6807,"b4-b6":0.5738,"b5-b6":0.397},"kept":{"0.3":["b1","b4"],"0.5":["b1","b4","b3"],"0.7":["b1","b4","b2","b5","b3","b6"]}}},"kalman1d":{"stage":"s0","defaults":{"frames":60,"x0":10,"v0":1.2,"sigma_a":0.05,"sigma_z":2,"interval":4,"seed":7},"spec":"PRNG mulberry32(seed); gauss = sqrt(-2 ln(1-r1)) * cos(2 pi r2). For t = 0..frames-1: a = sigma_a*gauss(); n = sigma_z*gauss() (draw both every frame, in this order); truth[t] = x; meas[t] = (t % interval == 0) ? x + n : null; then x = x + v + 0.5*a; v = v + a. Hold-last: est[t] = most recent non-null meas. Kalman (constant velocity, dt = 1): q = sigma_a^2, Q = [[q/4, q/2],[q/2, q]], R = sigma_z^2; init state [meas[0], 0], P = [[R, 0],[0, 10]], est[0] = meas[0]; for t >= 1 predict (x = F x, P = F P F^T + Q with F = [[1,1],[0,1]]), then update if meas[t] != null (S = P00 + R, K = [P00/S, P10/S], y = z - x0, x += K y, P = (I - K H) P with H = [1, 0]); est[t] = x0. RMSE over all frames.","expected_rmse":{"1":{"hold":2.1859,"kalman":0.7212},"2":{"hold":2.4596,"kalman":1.52},"4":{"hold":3.072,"kalman":1.9103},"8":{"hold":6.3448,"kalman":3.4477}},"expected_first":{"truth":[10,11.2035,12.3855],"meas":[8.2715,null,null,null,16.3055],"mulberry32_seed7_first3":[0.011704753153026104,0.06195825757458806,0.97690763277933]}}}}</script>
<script>
const content=JSON.parse(document.getElementById('content').textContent);let state={progress:{},quiz:{},checks:{},notes:{}},db=null,readOnly=false,writeQ={},timers={},labSkip={};
try{state.view=localStorage.getItem('physical-ai-view')||'study';state.stage=localStorage.getItem('physical-ai-stage')||'b'}catch{state.view='study';state.stage='b'}
/* PURE:BEGIN */
function mulberry32(seed){let a=seed>>>0;return function(){let t=a=(a+0x6D2B79F5)>>>0;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function gauss(rand){return Math.sqrt(-2*Math.log(1-rand()))*Math.cos(2*Math.PI*rand())}
function iou(a,b){const ix=Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0])),iy=Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1])),inter=ix*iy,u=(a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-inter;return u>0?inter/u:0}
function nms(boxes,thr){let order=[...boxes].sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id)),kept=[],steps=[];while(order.length){let top=order.shift(),removed=[];kept.push(top.id);order=order.filter(b=>{let v=iou(top.box,b.box);if(v>thr){removed.push([b.id,v]);return false}return true});steps.push({selected:top.id,removed})}return{kept,steps}}
function simulate1d(p){let {frames,x0,v0,sigma_a,sigma_z,interval,seed}=p,r=mulberry32(seed),x=x0,v=v0,truth=[],meas=[];for(let t=0;t<frames;t++){let a=sigma_a*gauss(r),n=sigma_z*gauss(r);truth.push(x);meas.push(t%interval===0?x+n:null);x=x+v+.5*a;v=v+a}return{truth,meas}}
function holdLast(meas){let last=null;return meas.map(z=>z!==null?(last=z):last)}
function kalman1d(meas,p){let q=p.sigma_a*p.sigma_a,R=p.sigma_z*p.sigma_z,P=[[R,0],[0,10]],x=[meas[0],0],out=[x[0]],Q=[[q/4,q/2],[q/2,q]];for(let t=1;t<meas.length;t++){x=[x[0]+x[1],x[1]];P=[[P[0][0]+P[0][1]+P[1][0]+P[1][1]+Q[0][0],P[0][1]+P[1][1]+Q[0][1]],[P[1][0]+P[1][1]+Q[1][0],P[1][1]+Q[1][1]]];if(meas[t]!==null){let S=P[0][0]+R,K=[P[0][0]/S,P[1][0]/S],y=meas[t]-x[0],old=P;x=[x[0]+K[0]*y,x[1]+K[1]*y];P=[[(1-K[0])*old[0][0],(1-K[0])*old[0][1]],[old[1][0]-K[1]*old[0][0],old[1][1]-K[1]*old[0][1]]]}out.push(x[0])}return out}
function rmse(a,b){return Math.sqrt(a.reduce((s,x,i)=>s+(x-b[i])**2,0)/a.length)}
function gradeQuiz(q,response){if(q.kind==='numeric'){let x=Number(String(response).replace(',','.'));if(!String(response).trim()||!Number.isFinite(x))return{valid:false};return{valid:true,correct:Math.abs(x-q.answer)<=q.tolerance}}return{valid:true,correct:Number(response)===q.answer}}
function stageStatus(stage,s){let qs=stage.quizzes.map(id=>s.quiz[id]),cs=stage.checks.map(c=>s.checks[c.id]);let passed=qs.length>0&&qs.every(x=>x?.correct)&&cs.every(x=>x?.confirmed);let activity=[...stage.resources,...stage.tasks].some(x=>s.progress[x.id]?.done)||qs.some(Boolean)||cs.some(Boolean);return passed?'passed':activity?'progress':'empty'}
function nextAction(c,s){let stages=c.stages,st=stages.find(x=>stageStatus(x,s)!=='passed'&&x.prereqs.every(id=>stageStatus(stages.find(y=>y.id===id),s)==='passed'))||stages.find(x=>stageStatus(x,s)!=='passed');if(!st)return null;let r=st.resources.find(x=>!s.progress[x.id]?.done),q=st.quizzes.map(id=>c.quizzes.find(z=>z.id===id)).find(x=>!s.quiz[x.id]?.correct),ch=st.checks.find(x=>!s.checks[x.id]?.confirmed),t=st.tasks.find(x=>!s.progress[x.id]?.done),item=r||q||ch||t;return{stage:st,item,kind:r?'resource':q?'quiz':ch?'check':'task'}}
/* PURE:END */
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function persist(k,v){try{localStorage.setItem(k,v)}catch{}}
function statusMark(st){let x=stageStatus(st,state);return x==='passed'?'<span class="pass">✓ 통과</span>':x==='progress'?'<span class="inprogress">● 진행</span>':'<span class="empty">○ 시작 전</span>'}
function setDoc(col,id,body){state[col][id]=body;render();if(!db||readOnly)return;let key=col+'/'+id,slot=writeQ[key]||{busy:false,next:null};writeQ[key]=slot;slot.next=body;if(slot.busy)return;let go=()=>{let val=slot.next;slot.next=null;slot.busy=true;db.collection(col).doc(id).set(val).catch(e=>{if(e?.code==='invalid_argument'){readOnly=true;render()}else{state.error=id;render()}}).finally(()=>{slot.busy=false;if(slot.next)go()})};go()}
function debounce(col,id,body){clearTimeout(timers[col+id]);timers[col+id]=setTimeout(()=>setDoc(col,id,body),800)}
function viewOverview(){return '<section><h2>한눈에 보기</h2><div class="table-wrap"><table><thead><tr><th>단계</th><th>무엇을</th><th>왜 (어디에 쓰나)</th><th>권장 기간</th></tr></thead><tbody>'+content.overview.map(x=>`<tr><td>${x.stage}</td><td>${x.what}</td><td>${x.why}</td><td>${x.period}</td></tr>`).join('')+'</tbody></table></div><p class="note">'+content.footnote+'</p></section><section><h2>흐름</h2><pre class="mermaid">'+esc(content.diagram)+'</pre></section><section><h2>공부하는 법</h2><h3>논문은 세 번에 나눠 읽기</h3><ol>'+content.studyTips.reading.map(x=>'<li>'+x+'</li>').join('')+'</ol><h3>노트는 다섯 줄로</h3><ol>'+content.studyTips.noteTemplate.map(x=>'<li>'+x.replace(/^\d+\. /,'')+'</li>').join('')+'</ol><h3>막힐 때</h3><ul>'+content.studyTips.stuck.map(x=>'<li>'+x+'</li>').join('')+'</ul></section>'}
function noteEditor(r){let n=state.notes[r.id]||{},keys=['solved','prior','idea','result','myuse'];return '<div class="note-editor" id="note-'+r.id+'">'+keys.map((k,i)=>`<label>${content.studyTips.noteTemplate[i]}<textarea data-note="${r.id}" data-key="${k}">${esc(n[k]||'')}</textarea></label>`).join('')+'</div>'}
function resources(st){return '<section><h3>순서대로 볼 자료</h3><p class="hint">읽음 표시는 통과 조건이 아닙니다. 확인 문제와 체크로 통과합니다.</p><div class="progressbar"><i style="width:'+(100*st.resources.filter(x=>state.progress[x.id]?.done).length/st.resources.length)+'%"></i></div>'+st.resources.map(r=>`<div class="resource" id="${r.id}"><div class="row"><div><a href="${r.url}" target="_blank" rel="noopener">${r.title}</a><div class="note">${r.note}</div></div><div><button data-progress="${r.id}">${state.progress[r.id]?.done?'✓ 읽음':'○ 읽음'}</button>${r.paper?` <button data-note-toggle="${r.id}">노트</button>`:''}</div></div>${r.paper&&state.openNote===r.id?noteEditor(r):''}${state.error===r.id?'<div class="wrong">저장 실패 — 다시 시도</div>':''}</div>`).join('')+'</section>'}
function quiz(q){let old=state.quiz[q.id],choices=q.kind==='numeric'?`<label for="answer-${q.id}">답</label><input id="answer-${q.id}" data-answer="${q.id}" type="text" inputmode="decimal" value="${old?.response??''}">`:`<fieldset><legend>${q.kind==='lab_prediction'?'예측':'선택'}</legend>${q.choices.map((x,i)=>`<label><input id="answer-${q.id}-${i}" data-choice="${q.id}" type="radio" name="${q.id}" value="${i}" ${String(old?.response)===String(i)?'checked':''}> ${x}</label>`).join('')}</fieldset>`;let res=old?`<div class="result ${old.correct?'pass':'wrong'}">${old.correct?'✓ 정답':'✗ 다시 생각해 보기'} · ${q.explanation} <span class="mono">${old.attempts}회 / 정답 ${old.correctCount}회</span></div>`:'';return `<div class="quiz" id="${q.id}"><p><b>${q.prompt}</b></p>${choices}<button data-submit="${q.id}">답 확인</button>${state.invalid===q.id?'<div class="wrong">숫자를 입력해 주세요.</div>':''}${res}</div>`}
function checks(st){return '<section><h3>다음 단계로 가기 전 체크</h3><p class="hint">자기 점검입니다. 기준을 보고 자신의 설명이 충분한지 판단하세요.</p>'+st.checks.map(c=>{let v=state.checks[c.id]||{};return `<div class="check" id="${c.id}"><b>${c.text}</b><label for="explain-${c.id}">내 말로 설명해 보기</label><textarea id="explain-${c.id}" data-checktext="${c.id}">${esc(v.explanation||'')}</textarea><div><button data-rubric="${c.id}">기준 보기</button> <button data-confirm="${c.id}">${v.confirmed?'✓ 기준을 충족했다':'○ 기준을 충족했다'}</button></div>${state.openRubric===c.id?'<ul>'+c.rubric.map(x=>'<li>'+x+'</li>').join('')+'</ul>':''}</div>`}).join('')+'</section>'}
function task(st){return '<section><h3>손으로 해 볼 것</h3><div class="progressbar"><i style="width:'+(100*st.tasks.filter(x=>state.progress[x.id]?.done).length/st.tasks.length)+'%"></i></div>'+st.tasks.map(t=>`<div class="task" id="${t.id}"><button data-progress="${t.id}">${state.progress[t.id]?.done?'✓ 해 봄':'○ 해 봄'}</button> ${t.text}</div>`).join('')+'</section>'}
function svgBoxes(boxes,kept){return `<svg viewBox="0 0 500 240" role="img" aria-label="NMS 박스 시각화">${boxes.map(b=>`<rect x="${b.box[0]*4}" y="${b.box[1]*2.6}" width="${(b.box[2]-b.box[0])*4}" height="${(b.box[3]-b.box[1])*2.6}" fill="none" stroke="${kept.includes(b.id)?'var(--pass)':'var(--danger)'}" stroke-width="3" ${kept.includes(b.id)?'':'stroke-dasharray="7 4"'}/><text x="${b.box[0]*4}" y="${b.box[1]*2.6-3}" fill="var(--fg)">${b.id} ${b.score}</text>`).join('')}</svg>`}
function lab(st){if(!st.lab)return '';let qs=content.quizzes.filter(q=>q.stage===st.id&&q.kind==='lab_prediction'),ready=qs.every(q=>state.quiz[q.id])||labSkip[st.id];let locked=ready?'':'disabled';if(st.lab==='iou-nms'){let a=state.boxA||[10,10,60,60],b=state.boxB||[35,30,85,80],valid=[...a,...b].every(x=>x>=0&&x<=100)&&a[2]>a[0]&&a[3]>a[1]&&b[2]>b[0]&&b[3]>b[1],v=valid?iou(a,b):0,thr=state.nmsThr??.5,n=nms(content.labs['iou-nms'].nms_preset,thr);return `<section><h3>실습 · IoU와 NMS</h3><div class="lab">${qs.map(quiz).join('')}<button data-skip="b">예측 건너뛰기</button><fieldset ${locked}><legend>두 박스 (0–100)</legend><div class="controls">${['A x1','A y1','A x2','A y2','B x1','B y1','B x2','B y2'].map((x,i)=>`<label>${x}<input data-box="${i<4?'a':'b'}" data-pos="${i%4}" type="number" min="0" max="100" value="${(i<4?a:b)[i%4]}"></label>`).join('')}</div></fieldset>${!valid?'<p class="wrong">x2는 x1보다, y2는 y1보다 커야 하며 값은 0–100이어야 합니다.</p>':''}<div class="chart"><svg viewBox="0 0 420 240" role="img" aria-label="두 박스와 교집합"><rect x="${a[0]*4}" y="${a[1]*2}" width="${(a[2]-a[0])*4}" height="${(a[3]-a[1])*2}" fill="none" stroke="var(--accent)" stroke-width="3"/><rect x="${b[0]*4}" y="${b[1]*2}" width="${(b[2]-b[0])*4}" height="${(b[3]-b[1])*2}" fill="none" stroke="var(--pass)" stroke-width="3"/></svg></div><p class="legend">면적 A ${(a[2]-a[0])*(a[3]-a[1])} · 면적 B ${(b[2]-b[0])*(b[3]-b[1])} · 교집합 ${Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0]))*Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1]))} · 합집합 ${valid?((a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0]))*Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1]))):'—'} · IoU ${v.toFixed(3)}</p><fieldset ${locked}><label for="nms-thr">NMS 임계값 ${thr.toFixed(2)}</label><input id="nms-thr" data-nms type="range" min=".1" max=".9" step=".05" value="${thr}"></fieldset><div class="chart">${svgBoxes(content.labs['iou-nms'].nms_preset,n.kept)}</div><p class="legend">실선 = 남김, 점선 = 제거. 남은 박스 ${n.kept.length}개: ${n.kept.join(', ')}</p><ol>${n.steps.map(x=>'<li>'+x.selected+' 선택'+(x.removed.length?' → '+x.removed.map(y=>y[0]+' 제거(IoU '+y[1].toFixed(3)+')').join(', '):'')+'</li>').join('')}</ol></div></section>`}
let p={...content.labs.kalman1d.defaults,...state.kf},sim=simulate1d(p),hold=holdLast(sim.meas),kf=kalman1d(sim.meas,p),mn=Math.min(...sim.truth,...hold,...kf),mx=Math.max(...sim.truth,...hold,...kf),pt=(x,i)=>`${i/59*580+30},${190-(x-mn)/(mx-mn)*160}`;return `<section><h3>실습 · 1차원 칼만 필터</h3><div class="lab">${qs.map(quiz).join('')}<button data-skip="s0">예측 건너뛰기</button><fieldset ${locked}><div class="controls"><label>검출 간격 N<input data-kf="interval" type="number" min="1" max="8" value="${p.interval}"></label><label>σ_z<input data-kf="sigma_z" type="number" min=".5" max="5" step=".5" value="${p.sigma_z}"></label><label>σ_a<input data-kf="sigma_a" type="number" min=".01" max=".3" step=".01" value="${p.sigma_a}"></label><label>seed<input data-kf="seed" type="number" step="1" value="${p.seed}"></label></div></fieldset><div class="chart"><svg viewBox="0 0 640 220" role="img" aria-label="truth, measurement, hold-last, Kalman line chart"><path d="M30 30V190H610" stroke="var(--line)" fill="none"/><text x="4" y="25" fill="var(--muted)">position</text><text x="570" y="215" fill="var(--muted)">frame</text><polyline points="${sim.truth.map(pt).join(' ')}" fill="none" stroke="var(--fg)"/><polyline points="${hold.map(pt).join(' ')}" fill="none" stroke="var(--accent)" stroke-dasharray="6 4"/><polyline points="${kf.map(pt).join(' ')}" fill="none" stroke="var(--pass)" stroke-width="3"/>${sim.meas.map((x,i)=>x===null?'':`<circle cx="${i/59*580+30}" cy="${190-(x-mn)/(mx-mn)*160}" r="3" fill="var(--danger)"/>`).join('')}</svg></div><p class="legend">실선 truth · 점 measurements · 파선 hold-last · 굵은 선 Kalman. hold-last RMSE ${rmse(hold,sim.truth).toFixed(3)}, Kalman RMSE ${rmse(kf,sim.truth).toFixed(3)}.</p><p>마지막 검출을 유지하던 고스트 박스 대신, 검출 없는 프레임도 속도로 위치를 이어 보는 모델입니다.</p></div></section>`}
function study(){let st=content.stages.find(x=>x.id===state.stage)||content.stages[0],na=nextAction(content,state),rail=content.stages.map(x=>`<button data-stage="${x.id}" aria-current="${x.id===st.id}"><span class="mono">${x.label}</span> ${x.title}<small>${statusMark(x)} · 선수: ${x.prereqs.length?x.prereqs.map(id=>content.stages.find(y=>y.id===id).label).join(', '):'없음'}</small></button>`).join('');let next=na?`<div class="next"><h2>다음에 할 일</h2><div class="mono">${na.stage.label} · ${na.stage.title}</div><p>${na.item.text||na.item.title||na.item.prompt}</p><button data-go="${na.item.id}">이 항목으로 이동</button></div>`:'<div class="next"><h2>다음에 할 일</h2><p>모든 단계를 통과했습니다. 기록을 돌아보며 프로젝트에 연결해 보세요.</p></div>';return next+`<div class="layout"><nav class="rail" aria-label="학습 단계">${rail}</nav><main><div class="stage-title"><span class="mono">STAGE ${st.label}</span><h2>${st.title}</h2><p>${statusMark(st)} ${st.prereqs.some(id=>stageStatus(content.stages.find(x=>x.id===id),state)!=='passed')?'<span class="note">선수 단계를 먼저 권장</span>':''}</p><p>${st.summary}</p><p class="why"><b>왜 배우나</b> ${st.why}</p></div>${st.flows?'<section><h3>흐름 한 장으로 보기</h3><div class="table-wrap"><table><thead><tr><th>갈래</th><th>흐름</th><th>각 단계가 푼 문제</th></tr></thead><tbody>'+st.flows.map(x=>`<tr><td>${x.branch}</td><td>${x.flow}</td><td>${x.solved}</td></tr>`).join('')+'</tbody></table></div></section>':''}<section><h3>핵심 개념</h3><div class="concepts">${st.concepts.map(x=>`<div class="concept"><b>${x.term}</b>${x.desc}</div>`).join('')}</div></section>${resources(st)}${lab(st)}<section><h3>확인 문제</h3>${content.quizzes.filter(q=>q.stage===st.id&&q.kind!=='lab_prediction').map(quiz).join('')}</section>${task(st)}${checks(st)}</main></div>`}
function glossary(){let q=(state.search||'').toLowerCase(),items=content.glossary.filter(x=>(x.term+x.desc).toLowerCase().includes(q));return `<section><h2>용어집</h2><label for="glossary-search">용어 또는 설명 검색</label><input id="glossary-search" type="text" value="${esc(state.search||'')}"><div class="table-wrap"><table><thead><tr><th>용어</th><th>쉬운 설명</th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.term}</td><td>${x.desc}</td></tr>`).join('')}</tbody></table></div></section>`}
function history(){let all=[];for(let [id,x]of Object.entries(state.progress))all.push({at:x.at,text:(x.done?'읽음/해 봄':'되돌림')+' · '+id});for(let [id,x]of Object.entries(state.quiz))all.push({at:x.at,text:(x.correct?'정답':'오답')+' · '+id});for(let [id,x]of Object.entries(state.checks))all.push({at:x.at,text:(x.confirmed?'체크 충족':'체크 저장')+' · '+id});for(let [id,x]of Object.entries(state.notes))all.push({at:x.at,text:'노트 저장 · '+id});return `<section><h2>기록</h2><button id="copy-record">내 기록 JSON 복사</button>${state.copyFallback?'<textarea class="copyout" readonly>'+esc(state.copyFallback)+'</textarea>':''}<ol>${all.sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,50).map(x=>'<li><span class="mono">'+(x.at||'')+'</span> '+x.text+'</li>').join('')||'<li>아직 기록이 없습니다.</li>'}</ol></section>`}
function render(){let app=$('#app'),body=state.view==='study'?study():state.view==='overview'?viewOverview():state.view==='glossary'?glossary():history();app.innerHTML=`<header class="top"><div class="shell"><div class="brand"><h1>Physical AI 공부 로드맵</h1><span class="eyebrow">${content.meta.fetched}</span></div><div class="tabs" role="tablist">${[['study','학습'],['overview','개요'],['glossary','용어집'],['history','기록']].map(x=>`<button id="tab-${x[0]}" data-view="${x[0]}" aria-selected="${state.view===x[0]}">${x[1]}</button>`).join('')}</div>${readOnly?'<div class="banner">읽기 전용</div>':!db?'<div class="banner">저장 기능을 쓸 수 없어 이 화면에서만 임시로 기억합니다</div>':''}</div></header><div class="shell">${body}</div>`;bind()}
function bind(){document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>{state.view=e.dataset.view;persist('physical-ai-view',state.view);render()});document.querySelectorAll('[data-stage]').forEach(e=>e.onclick=()=>{state.stage=e.dataset.stage;persist('physical-ai-stage',state.stage);render()});document.querySelectorAll('[data-progress]').forEach(e=>e.onclick=()=>{let id=e.dataset.progress;setDoc('progress',id,{done:!state.progress[id]?.done,at:new Date().toISOString()})});document.querySelectorAll('[data-note-toggle]').forEach(e=>e.onclick=()=>{state.openNote=state.openNote===e.dataset.noteToggle?null:e.dataset.noteToggle;render()});document.querySelectorAll('[data-note]').forEach(e=>{let save=()=>{let id=e.dataset.note,k=e.dataset.key,v={...(state.notes[id]||{}),[k]:e.value,at:new Date().toISOString()};debounce('notes',id,v)};e.oninput=save;e.onblur=save});document.querySelectorAll('[data-checktext]').forEach(e=>{let save=()=>debounce('checks',e.dataset.checktext,{...(state.checks[e.dataset.checktext]||{}),explanation:e.value,at:new Date().toISOString()});e.oninput=save;e.onblur=save});document.querySelectorAll('[data-rubric]').forEach(e=>e.onclick=()=>{state.openRubric=state.openRubric===e.dataset.rubric?null:e.dataset.rubric;render()});document.querySelectorAll('[data-confirm]').forEach(e=>e.onclick=()=>{let id=e.dataset.confirm;setDoc('checks',id,{...(state.checks[id]||{}),confirmed:!state.checks[id]?.confirmed,at:new Date().toISOString()})});document.querySelectorAll('[data-submit]').forEach(e=>e.onclick=()=>{let q=content.quizzes.find(x=>x.id===e.dataset.submit),el=document.querySelector('[data-answer="'+q.id+'"]')||document.querySelector('[data-choice="'+q.id+'"]:checked'),g=gradeQuiz(q,el?.value);if(!g.valid){state.invalid=q.id;render();return}let o=state.quiz[q.id]||{};setDoc('quiz',q.id,{response:el.value,correct:g.correct,attempts:(o.attempts||0)+1,correctCount:(o.correctCount||0)+(g.correct?1:0),at:new Date().toISOString()})});document.querySelectorAll('[data-skip]').forEach(e=>e.onclick=()=>{labSkip[e.dataset.skip]=true;render()});document.querySelectorAll('[data-box]').forEach(e=>e.oninput=()=>{let k=e.dataset.box==='a'?'boxA':'boxB',a=[...(state[k]||(k==='boxA'?[10,10,60,60]:[35,30,85,80]))];a[e.dataset.pos]=Number(e.value);state[k]=a;render()});let n=$('[data-nms]');if(n)n.oninput=()=>{state.nmsThr=Number(n.value);render()};document.querySelectorAll('[data-kf]').forEach(e=>e.oninput=()=>{state.kf={...(state.kf||{}),[e.dataset.kf]:Number(e.value)};render()});let s=$('#glossary-search');if(s)s.oninput=()=>{state.search=s.value;render()};let go=$('[data-go]');if(go)go.onclick=()=>{let e=$('#'+go.dataset.go);if(e)e.scrollIntoView({behavior:'smooth',block:'center'})};let cp=$('#copy-record');if(cp)cp.onclick=()=>{let text=JSON.stringify({progress:state.progress,quiz:state.quiz,checks:state.checks,notes:state.notes},null,2);navigator.clipboard?.writeText(text).catch(()=>{state.copyFallback=text;render()})}}
render();(async()=>{try{db=await window.claude?.use?.('db');if(!db){render();return}for(let col of ['progress','quiz','checks','notes'])db.collection(col).onSnapshot(snap=>{let x={};snap.forEach(d=>x[d.id]=d.data());state[col]=x;render()},()=>{db=null;render()});render()}catch{db=null;render()}})();
</script>
