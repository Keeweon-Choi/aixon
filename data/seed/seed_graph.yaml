assessment_items:
- id: ai:dot-product-01
  assesses:
    unit: concept:dot-product
    dimension: explain
  kind: numeric
  prompt: q = (1, 2, 0), k = (3, −1, 2)일 때 q·k는?
  answer: 1
  tolerance: 0
  rationale: 1·3 + 2·(−1) + 0·2 = 1
  verified_by: computation
- id: ai:dot-product-02
  assesses:
    unit: concept:dot-product
    dimension: explain
  kind: mcq
  prompt: 크기가 같은 두 벡터의 dot product가 가장 큰 경우는?
  choices:
  - 방향이 같을 때
  - 서로 수직일 때
  - 방향이 반대일 때
  - 방향과 상관없이 같다
  answer: 0
  rationale: a·b = ‖a‖‖b‖cos θ는 θ = 0일 때 가장 크다
- id: ai:matmul-01
  assesses:
    unit: concept:matrix-multiplication
    dimension: explain
  kind: numeric
  prompt: Q ∈ ℝ^{4×64}, K ∈ ℝ^{6×64}일 때 QKᵀ의 원소는 몇 개인가?
  answer: 24
  tolerance: 0
  rationale: QKᵀ ∈ ℝ^{4×6}
  verified_by: computation
- id: ai:matmul-02
  assesses:
    unit: concept:matrix-multiplication
    dimension: explain
  kind: mcq
  prompt: QKᵀ의 (i, j) 원소는 무엇인가?
  choices:
  - i번째 query와 j번째 key의 dot product
  - i번째 query와 j번째 value의 곱
  - Q와 K 원소별 곱의 전체 합
  - K의 i행 j열 원소
  answer: 0
  rationale: 행렬 곱의 (i, j) 원소는 Q의 i행과 Kᵀ의 j열(=K의 j행)의 내적
- id: ai:softmax-01
  assesses:
    unit: concept:softmax
    dimension: explain
  kind: numeric
  prompt: softmax([2, 1, 0])의 첫 번째 값은? (소수 셋째 자리)
  answer: 0.665
  tolerance: 0.002
  rationale: e²/(e²+e+1) ≈ 0.665 (lab fixture)
  verified_by: computation
- id: ai:softmax-02
  assesses:
    unit: concept:softmax
    dimension: explain
  kind: mcq
  prompt: 모든 logit에 같은 상수 c를 더한 softmax(z + c)는 softmax(z)와 어떤 관계인가?
  choices:
  - 같다
  - c배가 된다
  - e^c배가 된다
  - 합이 c가 된다
  answer: 0
  rationale: 분자·분모에 e^c가 함께 곱해져 약분된다
- id: ai:softmax-temperature-01
  assesses:
    unit: concept:softmax-temperature
    dimension: explain
  kind: numeric
  prompt: logit [2, 0], T = 0.5일 때 첫 번째 확률은? (소수 셋째 자리)
  answer: 0.982
  tolerance: 0.002
  rationale: z/T = [4, 0] → e⁴/(e⁴+1) ≈ 0.982 (lab fixture)
  verified_by: computation
- id: ai:lab-softmax-temp-01
  assesses:
    unit: concept:softmax-temperature
    dimension: explain
  kind: lab_prediction
  prompt: z = [2, 1, 0]에서 T를 1에서 0.1로 낮추면 가장 큰 확률은?
  choices:
  - 커진다
  - 작아진다
  - 그대로다
  answer: 0
  rationale: '0.665 → 0.99995: 온도를 낮추면 분포가 argmax로 몰린다'
  lab: lab:softmax-temperature
  scenario:
    logits:
    - 2
    - 1
    - 0
    T_from: 1
    T_to: 0.1
- id: ai:lab-softmax-temp-02
  assesses:
    unit: concept:softmax-temperature
    dimension: explain
  kind: lab_prediction
  prompt: z = [2, 0], T = 2일 때 첫 번째 확률은?
  answer: 0.731
  tolerance: 0.005
  rationale: e¹/(e¹+1) ≈ 0.731
  lab: lab:softmax-temperature
  scenario:
    logits:
    - 2
    - 0
    T: 2
  verified_by: computation
- id: ai:variance-of-sum-01
  assesses:
    unit: concept:variance-of-sum
    dimension: explain
  kind: numeric
  prompt: q, k의 성분이 서로 독립이고 평균 0, 분산 1이다. d_k = 64이면 Var(q·k)는?
  answer: 64
  tolerance: 0
  rationale: 독립 항 64개의 분산(각 1)의 합 (Transformer 각주 4)
  verified_by: computation
- id: ai:variance-of-sum-02
  assesses:
    unit: concept:variance-of-sum
    dimension: explain
  kind: mcq
  prompt: 같은 조건에서 q·k의 표준편차는 d_k에 따라 어떻게 변하나?
  choices:
  - √d_k에 비례
  - d_k에 비례
  - 일정하다
  - 1/d_k에 비례
  answer: 0
  rationale: 분산이 d_k이므로 표준편차는 √d_k
- id: ai:lab-sdpa-02
  assesses:
    unit: concept:variance-of-sum
    dimension: explain
  kind: lab_prediction
  prompt: d_k = 64일 때 q·k의 표준편차는?
  answer: 8
  tolerance: 0.5
  rationale: √64 = 8 (seed 42, 표본 10,000에서 Var 64.65)
  lab: lab:softmax-temperature
  scenario:
    d_k: 64
  verified_by: computation
- id: ai:sdpa-01
  assesses:
    unit: method:scaled-dot-product-attention
    dimension: explain
  kind: numeric
  prompt: query 하나와 key 두 개의 점수(스케일 후)가 [1, 1]이면 첫 번째 key의 attention 가중치는?
  answer: 0.5
  tolerance: 0.001
  rationale: 같은 점수 → softmax가 같은 가중치
  verified_by: computation
- id: ai:sdpa-02
  assesses:
    unit: method:scaled-dot-product-attention
    dimension: explain
  kind: mcq
  prompt: Attention(Q, K, V)의 출력은 무엇인가?
  choices:
  - value들의 가중합 (가중치는 query–key 호환도의 softmax)
  - key들의 가중합
  - query들의 평균
  - 점수가 가장 큰 value 하나
  answer: 0
  rationale: 'Transformer §3.2: output is a weighted sum of the values'
- id: ai:sdpa-derive-01
  assesses:
    unit: method:scaled-dot-product-attention
    dimension: derive
  kind: mcq
  prompt: QKᵀ를 √d_k로 나누는 이유로 Transformer 논문이 든 것은?
  choices:
  - d_k가 크면 dot product가 커져 softmax가 기울기가 매우 작은 영역으로 밀려나기 때문
  - 계산을 빠르게 하려고
  - 확률의 합을 1로 만들려고
  - value의 크기를 맞추려고
  answer: 0
  rationale: §3.2.1 "We suspect…"
- id: ai:sdpa-derive-02
  assesses:
    unit: method:scaled-dot-product-attention
    dimension: derive
  kind: numeric
  prompt: d_k = 16에서 q·k의 표준편차가 4일 때, √d_k로 나눈 뒤의 표준편차는?
  answer: 1
  tolerance: 0.001
  rationale: 4 / √16 = 1
  verified_by: computation
- id: ai:lab-sdpa-01
  assesses:
    unit: method:scaled-dot-product-attention
    dimension: derive
  kind: lab_prediction
  prompt: scaling 없이 d_k를 4에서 512로 키우면 평균 최대 attention 가중치는?
  choices:
  - 1에 가까워진다(포화)
  - 0에 가까워진다
  - 변하지 않는다
  answer: 0
  rationale: 0.525 → 0.955 (seed 42, 표본 1,000)
  lab: lab:softmax-temperature
  scenario:
    scaled: false
    d_k_from: 4
    d_k_to: 512
    n_keys: 8
- id: ai:mha-01
  assesses:
    unit: method:multi-head-attention
    dimension: explain
  kind: numeric
  prompt: hidden 크기 D = 768, head 12개일 때 head 하나의 차원 D_h = D/k는?
  answer: 64
  tolerance: 0
  rationale: 768/12 = 64 (ViT Appendix A, Table 1)
  verified_by: computation
- id: ai:mha-02
  assesses:
    unit: method:multi-head-attention
    dimension: explain
  kind: mcq
  prompt: multi-head attention을 쓰는 이유로 Transformer 논문이 든 것은?
  choices:
  - 서로 다른 표현 부분공간의 정보를 여러 위치에서 함께 볼 수 있다
  - 파라미터 수를 줄인다
  - softmax가 필요 없어진다
  - 순서 정보를 넣는다
  answer: 0
  rationale: §3.2.2
