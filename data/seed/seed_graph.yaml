graph:
  id: aixon-seed-cv-representation
  name: CV Representation Learning — CNN → Transformer → ViT
  description: 합성곱 신경망에서 Transformer와 Vision Transformer로 이어지는 표현 학습의 핵심 개념과 연구 계보를 다룬다.
  assumed_background:
  - 고등학교 대수와 지수·로그 함수
  - 미분의 기초(도함수, 연쇄법칙)
  - 확률의 기초(평균, 분산)
  - 신경망 학습의 기초(순전파, 손실, 경사하강)
  updated_at: '2026-10-15'
