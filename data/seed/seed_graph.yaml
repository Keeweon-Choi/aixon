concepts:
- id: concept:dot-product
  name: 내적
  summary: 신경망 표현 학습에서 사용하는 핵심 단위다.
  summary_by: agent:codex
  dimensions: &id001
  - recognize
  - explain
  - implement
  formula: a\cdot b=\sum_i a_i b_i
  estimated_minutes:
    explain: 15
- id: concept:matrix-multiplication
  name: 행렬 곱셈
  summary: 신경망 표현 학습에서 사용하는 핵심 단위다.
  summary_by: agent:codex
  dimensions: *id001
  estimated_minutes:
    explain: 20
- id: concept:softmax
  name: Softmax
  summary: 신경망 표현 학습에서 사용하는 핵심 단위다.
  summary_by: agent:codex
  dimensions: &id003
  - recognize
  - explain
  - derive
  - implement
  formula: \mathrm{softmax}(z)_i=\frac{e^{z_i}}{\sum_j e^{z_j}}
  estimated_minutes:
    explain: 20
    derive: 25
- id: concept:softmax-temperature
  name: Softmax 온도
  summary: 신경망 표현 학습에서 사용하는 핵심 단위다.
  summary_by: agent:codex
  dimensions:
  - recognize
  - explain
  - derive
  formula: p_i=\frac{e^{z_i/T}}{\sum_j e^{z_j/T}}
  estimated_minutes:
    explain: 20
