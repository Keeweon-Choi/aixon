schema_version: 1
graph:
  id: aixon-ai-atlas
  name: AI Knowledge Atlas
  description: Broad editorial map of artificial-intelligence research areas with unverified bibliographic landmarks.
  assumed_background: [고등학교 수준의 수학과 프로그래밍]
defaults:
  field: &field {summary_by: agent:codex}
  ku: &ku {dimensions: [recognize, explain], summary_by: agent:codex}
  paper: &paper {metadata_checked: {}}

fields:
  - {<<: *field, id: field:probabilistic-machine-learning, name: 확률적 기계학습, aliases: [Probabilistic Machine Learning, PML], summary: 확률적 기계학습은 확률 모델로 데이터와 예측의 불확실성을 다루는 분야이다., parents: [field:machine-learning]}
  - {<<: *field, id: field:learning-theory, name: 학습 이론, aliases: [Learning Theory], summary: 학습 이론은 학습 가능성 및 일반화의 조건을 수학적으로 연구하는 분야이다., parents: [field:machine-learning]}
  - {<<: *field, id: field:optimization, name: 최적화, aliases: [Optimization], summary: 최적화는 목적함수를 효율적으로 최소화하거나 최대화하는 방법을 연구하는 분야이다., parents: [field:machine-learning]}
  - {<<: *field, id: field:reinforcement-learning, name: 강화학습, aliases: [Reinforcement Learning, RL], summary: 강화학습은 환경과의 상호작용에서 누적 보상을 최적화하는 정책을 학습하는 분야이다., parents: [field:machine-learning]}
  - {<<: *field, id: field:robotics-embodied-ai, name: 로보틱스와 체화 인공지능, aliases: [Robotics, Embodied AI], summary: 로보틱스와 체화 인공지능은 물리적 몸체를 가진 에이전트의 지각과 행동을 연구하는 분야이다., parents: [field:artificial-intelligence]}
  - {<<: *field, id: field:speech-audio, name: 음성 및 오디오 인공지능, aliases: [Speech and Audio], summary: 음성 및 오디오 인공지능은 소리 신호의 인식과 생성 및 이해를 연구하는 분야이다., parents: [field:artificial-intelligence]}
  - {<<: *field, id: field:generative-models, name: 생성 모델, aliases: [Generative Models], summary: 생성 모델은 데이터 분포를 학습하여 새로운 표본을 생성하는 모델을 연구하는 분야이다., parents: [field:machine-learning, field:deep-learning]}
  - {<<: *field, id: field:multimodal-learning, name: 멀티모달 학습, aliases: [Multimodal Learning], summary: 멀티모달 학습은 서로 다른 감각 또는 형식의 정보를 함께 학습하는 분야이다., parents: [field:machine-learning, field:deep-learning]}
  - {<<: *field, id: field:graph-machine-learning, name: 그래프 기계학습, aliases: [Graph Machine Learning, Graph ML], summary: 그래프 기계학습은 관계 구조를 가진 데이터에서 표현과 예측을 학습하는 분야이다., parents: [field:machine-learning]}
  - {<<: *field, id: field:knowledge-representation-reasoning, name: 지식 표현과 추론, aliases: [Knowledge Representation and Reasoning, KR], summary: 지식 표현과 추론은 기호적 지식을 표현하고 그로부터 결론을 도출하는 분야이다., parents: [field:artificial-intelligence]}
  - {<<: *field, id: field:search-planning, name: 탐색과 계획, aliases: [Search and Planning], summary: 탐색과 계획은 목표를 달성하는 상태 전이와 행동 순서를 계산하는 분야이다., parents: [field:artificial-intelligence]}
  - {<<: *field, id: field:multi-agent-systems, name: 다중 에이전트 시스템, aliases: [Multi-Agent Systems, MAS], summary: 다중 에이전트 시스템은 여러 자율 에이전트의 협력과 경쟁 및 조정을 연구하는 분야이다., parents: [field:artificial-intelligence]}
  - {<<: *field, id: field:ai-safety-alignment, name: 인공지능 안전과 정렬, aliases: [AI Safety, AI Alignment], summary: 인공지능 안전과 정렬은 인공지능 시스템의 목표와 행동을 인간의 의도 및 제약에 맞추는 분야이다., parents: [field:artificial-intelligence]}
  - {<<: *field, id: field:interpretability, name: 해석가능성, aliases: [Interpretability, Explainable AI, XAI], summary: 해석가능성은 모델의 예측과 내부 표현을 사람이 이해할 수 있게 하는 방법을 연구하는 분야이다., parents: [field:machine-learning]}
  - {<<: *field, id: field:fairness-ethics, name: 공정성과 인공지능 윤리, aliases: [Fairness and AI Ethics], summary: 공정성과 인공지능 윤리는 자동화된 의사결정의 차별과 책임 및 사회적 영향을 연구하는 분야이다., parents: [field:artificial-intelligence]}
  - {<<: *field, id: field:ml-systems-efficient-inference, name: 기계학습 시스템과 효율적 추론, aliases: [ML Systems, Efficient Inference], summary: 기계학습 시스템과 효율적 추론은 모델 학습과 배포의 계산 및 메모리 효율을 연구하는 분야이다., parents: [field:machine-learning]}
  - {<<: *field, id: field:information-retrieval-recommender-systems, name: 정보 검색과 추천 시스템, aliases: [Information Retrieval, Recommender Systems, IR], summary: 정보 검색과 추천 시스템은 정보 요구에 맞는 문서와 항목을 순위화하는 분야이다., parents: [field:artificial-intelligence]}
  - {<<: *field, id: field:bayesian-learning, name: 베이즈 학습, aliases: [Bayesian Learning], summary: 베이즈 학습은 사전분포와 관측을 결합해 사후분포를 계산하는 학습 분야이다., parents: [field:probabilistic-machine-learning]}
  - {<<: *field, id: field:variational-inference, name: 변분 추론, aliases: [Variational Inference, VI], summary: 변분 추론은 근사 분포를 최적화하여 사후분포를 근사하는 방법을 연구하는 분야이다., parents: [field:probabilistic-machine-learning]}
  - {<<: *field, id: field:gaussian-processes, name: 가우스 과정, aliases: [Gaussian Processes, GP], summary: 가우스 과정은 함수 값들의 결합분포를 가우시안으로 모델링하는 확률 모델 분야이다., parents: [field:probabilistic-machine-learning]}
  - {<<: *field, id: field:uncertainty-calibration, name: 불확실성 추정과 보정, aliases: [Uncertainty Estimation, Calibration], summary: 불확실성 추정과 보정은 예측 신뢰도가 실제 정확도와 대응하도록 만드는 분야이다., parents: [field:probabilistic-machine-learning]}
  - {<<: *field, id: field:pac-learning, name: PAC 학습, aliases: [PAC Learning], summary: PAC 학습은 높은 확률로 작은 일반화 오차를 얻는 학습 조건을 정의하는 이론 분야이다., parents: [field:learning-theory]}
  - {<<: *field, id: field:generalization-theory, name: 일반화 이론, aliases: [Generalization Theory], summary: 일반화 이론은 훈련 데이터 밖에서 모델 성능이 유지되는 이유를 연구하는 분야이다., parents: [field:learning-theory]}
  - {<<: *field, id: field:statistical-learning, name: 통계적 학습 이론, aliases: [Statistical Learning Theory], summary: 통계적 학습 이론은 표본과 가설 공간의 관계를 확률적으로 분석하는 분야이다., parents: [field:learning-theory]}
  - {<<: *field, id: field:neural-tangent-kernels, name: 신경 접선 커널, aliases: [Neural Tangent Kernel, NTK], summary: 신경 접선 커널은 넓은 신경망의 학습 동역학을 커널로 근사하는 이론 분야이다., parents: [field:learning-theory, field:deep-learning]}
  - {<<: *field, id: field:gradient-methods, name: 경사 기반 방법, aliases: [Gradient Methods], summary: 경사 기반 방법은 미분 정보를 사용하여 목적함수의 해를 갱신하는 최적화 분야이다., parents: [field:optimization]}
  - {<<: *field, id: field:adaptive-optimization, name: 적응형 최적화, aliases: [Adaptive Optimization], summary: 적응형 최적화는 매개변수별 통계량으로 갱신 크기를 조절하는 방법을 연구하는 분야이다., parents: [field:optimization]}
  - {<<: *field, id: field:second-order-optimization, name: 이차 최적화, aliases: [Second-Order Optimization], summary: 이차 최적화는 곡률 정보를 활용해 최적화 갱신을 개선하는 분야이다., parents: [field:optimization]}
  - {<<: *field, id: field:constrained-optimization, name: 제약 최적화, aliases: [Constrained Optimization], summary: 제약 최적화는 허용 가능한 해의 집합 안에서 목적함수를 최적화하는 분야이다., parents: [field:optimization]}
  - {<<: *field, id: field:value-based-rl, name: 가치 기반 강화학습, aliases: [Value-Based Reinforcement Learning], summary: 가치 기반 강화학습은 상태 또는 행동 가치의 추정으로 정책을 선택하는 분야이다., parents: [field:reinforcement-learning]}
  - {<<: *field, id: field:policy-gradient, name: 정책 경사, aliases: [Policy Gradient], summary: 정책 경사는 기대 보상에 대한 정책 매개변수의 기울기를 추정하는 분야이다., parents: [field:reinforcement-learning]}
  - {<<: *field, id: field:actor-critic, name: 액터 크리틱, aliases: [Actor-Critic], summary: 액터 크리틱은 정책을 갱신하는 액터와 가치를 추정하는 크리틱을 함께 학습하는 분야이다., parents: [field:reinforcement-learning]}
  - {<<: *field, id: field:model-based-rl, name: 모델 기반 강화학습, aliases: [Model-Based Reinforcement Learning], summary: 모델 기반 강화학습은 환경의 동역학 모델로 행동 결과를 예측하는 분야이다., parents: [field:reinforcement-learning]}
  - {<<: *field, id: field:robot-learning, name: 로봇 학습, aliases: [Robot Learning], summary: 로봇 학습은 데이터와 경험으로 로봇의 지각 및 제어 능력을 획득하는 분야이다., parents: [field:robotics-embodied-ai, field:machine-learning]}
  - {<<: *field, id: field:imitation-learning, name: 모방 학습, aliases: [Imitation Learning], summary: 모방 학습은 전문가 시연을 바탕으로 행동 정책을 학습하는 분야이다., parents: [field:robotics-embodied-ai]}
  - {<<: *field, id: field:motion-planning, name: 운동 계획, aliases: [Motion Planning], summary: 운동 계획은 로봇이 충돌을 피하며 목표 자세에 도달하는 경로를 계산하는 분야이다., parents: [field:robotics-embodied-ai, field:search-planning]}
  - {<<: *field, id: field:simultaneous-localization-mapping, name: 동시적 위치추정과 지도작성, aliases: [Simultaneous Localization and Mapping, SLAM], summary: 동시적 위치추정과 지도작성은 센서 관측으로 위치와 환경 지도를 함께 추정하는 분야이다., parents: [field:robotics-embodied-ai]}
  - {<<: *field, id: field:automatic-speech-recognition, name: 자동 음성 인식, aliases: [Automatic Speech Recognition, ASR], summary: 자동 음성 인식은 음성 신호를 문자 또는 단어열로 변환하는 분야이다., parents: [field:speech-audio]}
  - {<<: *field, id: field:speech-synthesis, name: 음성 합성, aliases: [Text-to-Speech, TTS], summary: 음성 합성은 텍스트 또는 의미 표현으로부터 음성 파형을 생성하는 분야이다., parents: [field:speech-audio]}
  - {<<: *field, id: field:audio-representation-learning, name: 오디오 표현 학습, aliases: [Audio Representation Learning], summary: 오디오 표현 학습은 소리 신호에서 전이 가능한 특징을 학습하는 분야이다., parents: [field:speech-audio, field:representation-learning]}
  - {<<: *field, id: field:speaker-recognition, name: 화자 인식, aliases: [Speaker Recognition], summary: 화자 인식은 음성으로 발화자의 신원을 분류하거나 검증하는 분야이다., parents: [field:speech-audio]}
  - {<<: *field, id: field:variational-autoencoders, name: 변분 오토인코더, aliases: [Variational Autoencoders, VAE], summary: 변분 오토인코더는 잠재변수 확률 모델과 변분 추론으로 데이터를 생성하는 분야이다., parents: [field:generative-models]}
  - {<<: *field, id: field:generative-adversarial-networks, name: 생성적 적대 신경망, aliases: [Generative Adversarial Networks, GAN], summary: 생성적 적대 신경망은 생성자와 판별자의 경쟁으로 데이터 표본을 생성하는 분야이다., parents: [field:generative-models]}
  - {<<: *field, id: field:diffusion-models, name: 확산 모델, aliases: [Diffusion Models], summary: 확산 모델은 점진적 잡음 제거 과정을 학습하여 데이터를 생성하는 분야이다., parents: [field:generative-models]}
  - {<<: *field, id: field:autoregressive-models, name: 자기회귀 모델, aliases: [Autoregressive Models], summary: 자기회귀 모델은 이전 변수에 조건부로 다음 변수를 예측하여 분포를 모델링하는 분야이다., parents: [field:generative-models]}
  - {<<: *field, id: field:vision-language-learning, name: 시각 언어 학습, aliases: [Vision-Language Learning], summary: 시각 언어 학습은 이미지와 텍스트 사이의 의미적 대응을 학습하는 분야이다., parents: [field:multimodal-learning, field:computer-vision, field:natural-language-processing]}
  - {<<: *field, id: field:multimodal-fusion, name: 멀티모달 융합, aliases: [Multimodal Fusion], summary: 멀티모달 융합은 여러 형식의 정보를 결합하여 예측에 사용하는 분야이다., parents: [field:multimodal-learning]}
  - {<<: *field, id: field:image-captioning, name: 이미지 캡셔닝, aliases: [Image Captioning], summary: 이미지 캡셔닝은 이미지 내용을 자연어 문장으로 기술하는 분야이다., parents: [field:multimodal-learning, field:computer-vision, field:natural-language-processing]}
  - {<<: *field, id: field:multimodal-retrieval, name: 멀티모달 검색, aliases: [Multimodal Retrieval], summary: 멀티모달 검색은 서로 다른 형식의 질의와 항목을 공통 의미 공간에서 검색하는 분야이다., parents: [field:multimodal-learning, field:information-retrieval-recommender-systems]}
  - {<<: *field, id: field:graph-neural-networks, name: 그래프 신경망, aliases: [Graph Neural Networks, GNN], summary: 그래프 신경망은 이웃 노드와 간선의 정보를 메시지 전달로 집계하는 분야이다., parents: [field:graph-machine-learning, field:deep-learning]}
  - {<<: *field, id: field:graph-representation-learning, name: 그래프 표현 학습, aliases: [Graph Representation Learning], summary: 그래프 표현 학습은 노드와 간선 및 그래프 전체의 벡터 표현을 학습하는 분야이다., parents: [field:graph-machine-learning, field:representation-learning]}
  - {<<: *field, id: field:graph-attention, name: 그래프 어텐션, aliases: [Graph Attention], summary: 그래프 어텐션은 이웃별 중요도를 학습해 그래프 정보를 집계하는 분야이다., parents: [field:graph-machine-learning]}
  - {<<: *field, id: field:graph-generative-models, name: 그래프 생성 모델, aliases: [Graph Generative Models], summary: 그래프 생성 모델은 원하는 구조적 성질을 가진 그래프를 생성하는 분야이다., parents: [field:graph-machine-learning, field:generative-models]}
  - {<<: *field, id: field:knowledge-graphs, name: 지식 그래프, aliases: [Knowledge Graphs, KG], summary: 지식 그래프는 엔티티와 관계를 그래프 형태의 사실로 표현하는 분야이다., parents: [field:knowledge-representation-reasoning]}
  - {<<: *field, id: field:automated-reasoning, name: 자동 추론, aliases: [Automated Reasoning], summary: 자동 추론은 형식 언어로 표현된 규칙과 사실에서 결론을 계산하는 분야이다., parents: [field:knowledge-representation-reasoning]}
  - {<<: *field, id: field:neuro-symbolic-ai, name: 뉴로심볼릭 인공지능, aliases: [Neuro-Symbolic AI], summary: 뉴로심볼릭 인공지능은 신경망 학습과 기호적 추론을 결합하는 분야이다., parents: [field:knowledge-representation-reasoning, field:machine-learning]}
  - {<<: *field, id: field:ontology-engineering, name: 온톨로지 공학, aliases: [Ontology Engineering], summary: 온톨로지 공학은 도메인의 개념과 관계를 명시적 어휘로 설계하는 분야이다., parents: [field:knowledge-representation-reasoning]}
  - {<<: *field, id: field:heuristic-search, name: 휴리스틱 탐색, aliases: [Heuristic Search], summary: 휴리스틱 탐색은 목표까지의 비용 추정으로 탐색 순서를 안내하는 분야이다., parents: [field:search-planning]}
  - {<<: *field, id: field:automated-planning, name: 자동 계획, aliases: [Automated Planning], summary: 자동 계획은 초기 상태와 목표 및 행동 모델에서 실행 계획을 합성하는 분야이다., parents: [field:search-planning]}
  - {<<: *field, id: field:monte-carlo-tree-search, name: 몬테카를로 트리 탐색, aliases: [Monte Carlo Tree Search, MCTS], summary: 몬테카를로 트리 탐색은 무작위 시뮬레이션으로 트리 행동의 가치를 추정하는 분야이다., parents: [field:search-planning]}
  - {<<: *field, id: field:hierarchical-planning, name: 계층적 계획, aliases: [Hierarchical Planning], summary: 계층적 계획은 추상적 과업을 더 구체적인 하위 과업으로 분해하는 분야이다., parents: [field:search-planning]}
  - {<<: *field, id: field:multi-agent-reinforcement-learning, name: 다중 에이전트 강화학습, aliases: [Multi-Agent Reinforcement Learning, MARL], summary: 다중 에이전트 강화학습은 여러 학습 에이전트의 상호의존적 정책을 최적화하는 분야이다., parents: [field:multi-agent-systems, field:reinforcement-learning]}
  - {<<: *field, id: field:cooperative-ai, name: 협력 인공지능, aliases: [Cooperative AI], summary: 협력 인공지능은 공동 목표를 위해 에이전트들이 정보를 공유하고 행동을 조정하는 분야이다., parents: [field:multi-agent-systems]}
  - {<<: *field, id: field:emergent-communication, name: 창발적 의사소통, aliases: [Emergent Communication], summary: 창발적 의사소통은 공동 과업에서 에이전트들이 통신 규약을 스스로 형성하는 분야이다., parents: [field:multi-agent-systems]}
  - {<<: *field, id: field:mechanism-design, name: 메커니즘 설계, aliases: [Mechanism Design], summary: 메커니즘 설계는 참여자의 전략적 행동 아래 바람직한 결과를 유도하는 규칙을 설계하는 분야이다., parents: [field:multi-agent-systems]}
  - {<<: *field, id: field:robustness, name: 견고성, aliases: [Robustness], summary: 견고성은 입력 교란과 환경 변화에도 시스템의 성능과 행동이 유지되는 성질을 연구하는 분야이다., parents: [field:ai-safety-alignment]}
  - {<<: *field, id: field:reward-learning, name: 보상 학습, aliases: [Reward Learning], summary: 보상 학습은 선호나 시연으로부터 목표를 나타내는 보상 함수를 추정하는 분야이다., parents: [field:ai-safety-alignment, field:reinforcement-learning]}
  - {<<: *field, id: field:reinforcement-learning-from-human-feedback, name: 인간 피드백 강화학습, aliases: [Reinforcement Learning from Human Feedback, RLHF], summary: 인간 피드백 강화학습은 사람의 선호를 이용해 정책이나 언어 모델을 조정하는 분야이다., parents: [field:ai-safety-alignment]}
  - {<<: *field, id: field:ai-evaluation, name: 인공지능 평가, aliases: [AI Evaluation, Evals], summary: 인공지능 평가는 능력과 위험 및 실패 양상을 측정하는 절차를 연구하는 분야이다., parents: [field:ai-safety-alignment]}
  - {<<: *field, id: field:feature-attribution, name: 특성 기여도, aliases: [Feature Attribution], summary: 특성 기여도는 특정 예측에 각 입력 특성이 기여한 정도를 추정하는 분야이다., parents: [field:interpretability]}
  - {<<: *field, id: field:example-based-explanations, name: 사례 기반 설명, aliases: [Example-Based Explanations], summary: 사례 기반 설명은 예측을 대표 사례와 반사실 사례로 설명하는 분야이다., parents: [field:interpretability]}
  - {<<: *field, id: field:mechanistic-interpretability, name: 기계론적 해석가능성, aliases: [Mechanistic Interpretability], summary: 기계론적 해석가능성은 신경망 내부 회로와 특징의 인과적 역할을 분석하는 분야이다., parents: [field:interpretability]}
  - {<<: *field, id: field:concept-based-explanations, name: 개념 기반 설명, aliases: [Concept-Based Explanations], summary: 개념 기반 설명은 사람이 이해하는 고수준 개념으로 모델 결정을 설명하는 분야이다., parents: [field:interpretability]}
  - {<<: *field, id: field:algorithmic-fairness, name: 알고리즘 공정성, aliases: [Algorithmic Fairness], summary: 알고리즘 공정성은 집단 간 불리한 결과의 차이를 측정하고 완화하는 분야이다., parents: [field:fairness-ethics]}
  - {<<: *field, id: field:privacy-preserving-ml, name: 프라이버시 보존 기계학습, aliases: [Privacy-Preserving Machine Learning], summary: 프라이버시 보존 기계학습은 학습과 추론에서 개인 정보의 노출을 줄이는 분야이다., parents: [field:fairness-ethics, field:machine-learning]}
  - {<<: *field, id: field:ai-governance, name: 인공지능 거버넌스, aliases: [AI Governance], summary: 인공지능 거버넌스는 인공지능의 개발과 사용을 위한 제도 및 책임 구조를 연구하는 분야이다., parents: [field:fairness-ethics]}
  - {<<: *field, id: field:responsible-ai, name: 책임 있는 인공지능, aliases: [Responsible AI], summary: 책임 있는 인공지능은 공정성과 안전 및 투명성을 개발 과정에 통합하는 분야이다., parents: [field:fairness-ethics]}
  - {<<: *field, id: field:model-compression, name: 모델 압축, aliases: [Model Compression], summary: 모델 압축은 정확도를 유지하면서 모델의 저장 공간과 연산량을 줄이는 분야이다., parents: [field:ml-systems-efficient-inference]}
  - {<<: *field, id: field:efficient-transformers, name: 효율적 트랜스포머, aliases: [Efficient Transformers], summary: 효율적 트랜스포머는 긴 입력에서 어텐션 계산 비용을 낮추는 구조를 연구하는 분야이다., parents: [field:ml-systems-efficient-inference, field:deep-learning]}
  - {<<: *field, id: field:distributed-training, name: 분산 학습, aliases: [Distributed Training], summary: 분산 학습은 여러 장치와 노드에서 모델 학습 계산을 병렬화하는 분야이다., parents: [field:ml-systems-efficient-inference]}
  - {<<: *field, id: field:federated-learning, name: 연합 학습, aliases: [Federated Learning], summary: 연합 학습은 원시 데이터를 중앙에 모으지 않고 여러 참여자가 공동 모델을 학습하는 분야이다., parents: [field:ml-systems-efficient-inference]}
  - {<<: *field, id: field:neural-information-retrieval, name: 신경 정보 검색, aliases: [Neural Information Retrieval], summary: 신경 정보 검색은 신경망 표현으로 질의와 문서의 관련성을 추정하는 분야이다., parents: [field:information-retrieval-recommender-systems, field:machine-learning]}
  - {<<: *field, id: field:dense-retrieval, name: 밀집 검색, aliases: [Dense Retrieval], summary: 밀집 검색은 질의와 문서를 연속 벡터로 인코딩하여 관련 문서를 찾는 분야이다., parents: [field:information-retrieval-recommender-systems]}
  - {<<: *field, id: field:collaborative-filtering, name: 협업 필터링, aliases: [Collaborative Filtering], summary: 협업 필터링은 사용자와 항목의 상호작용으로 선호 항목을 예측하는 분야이다., parents: [field:information-retrieval-recommender-systems]}
  - {<<: *field, id: field:learning-to-rank, name: 학습 기반 순위화, aliases: [Learning to Rank, LTR], summary: 학습 기반 순위화는 감독 신호로 검색 결과의 순서를 학습하는 분야이다., parents: [field:information-retrieval-recommender-systems]}
  - {<<: *field, id: field:object-detection, name: 객체 탐지, aliases: [Object Detection], summary: 객체 탐지는 이미지에서 객체의 범주와 위치를 함께 예측하는 분야이다., parents: [field:computer-vision]}
  - {<<: *field, id: field:semantic-segmentation, name: 의미론적 분할, aliases: [Semantic Segmentation], summary: 의미론적 분할은 이미지의 각 픽셀에 의미 범주를 할당하는 분야이다., parents: [field:computer-vision]}
  - {<<: *field, id: field:visual-self-supervision, name: 시각 자기지도학습, aliases: [Visual Self-Supervised Learning], summary: 시각 자기지도학습은 라벨 없이 이미지 자체의 구조로 표현을 학습하는 분야이다., parents: [field:computer-vision, field:representation-learning]}
  - {<<: *field, id: field:visual-generation, name: 시각 생성, aliases: [Visual Generation], summary: 시각 생성은 이미지와 비디오의 분포를 학습하여 새로운 시각 콘텐츠를 생성하는 분야이다., parents: [field:computer-vision, field:generative-models], related: [{id: model:vit, note: 시드의 비전 트랜스포머 모델을 관련 모델로 참조한다.}]}
  - {<<: *field, id: field:language-modeling, name: 언어 모델링, aliases: [Language Modeling, LM], summary: 언어 모델링은 앞선 문맥에 조건부로 다음 언어 단위를 예측하는 분야이다., parents: [field:natural-language-processing]}
  - {<<: *field, id: field:information-extraction, name: 정보 추출, aliases: [Information Extraction, IE], summary: 정보 추출은 비정형 텍스트에서 엔티티와 관계 및 사건을 구조화하는 분야이다., parents: [field:natural-language-processing]}
  - {<<: *field, id: field:question-answering, name: 질의응답, aliases: [Question Answering, QA], summary: 질의응답은 자연어 질문에 근거가 있는 답을 생성하거나 추출하는 분야이다., parents: [field:natural-language-processing]}
  - {<<: *field, id: field:text-summarization, name: 텍스트 요약, aliases: [Text Summarization], summary: 텍스트 요약은 긴 문서의 핵심 정보를 더 짧은 형태로 보존하는 분야이다., parents: [field:natural-language-processing], related: [{id: model:bert, note: 시드의 언어 표현 모델을 관련 모델로 참조한다.}]}

problems:
  - {<<: *field, id: problem:probabilistic-uncertainty, name: 예측 불확실성, aliases: [Predictive Uncertainty], summary: 예측 불확실성은 모델이 자신의 예측 신뢰도를 신뢰성 있게 표현하지 못하는 문제이다., question: "모델의 예측 확률을 실제 오류 가능성과 어떻게 일치시킬 수 있는가?", fields: [field:probabilistic-machine-learning]}
  - {<<: *field, id: problem:generalization-gap, name: 일반화 격차, aliases: [Generalization Gap], summary: 일반화 격차는 훈련 성능과 새로운 데이터 성능의 차이에 관한 문제이다., question: "제한된 표본에서 학습한 모델의 일반화 오차를 어떻게 설명하고 줄일 수 있는가?", fields: [field:learning-theory]}
  - {<<: *field, id: problem:optimization-stability, name: 최적화 안정성, aliases: [Optimization Stability], summary: 최적화 안정성은 학습률과 곡률 및 잡음이 학습 실패를 일으킬 수 있는 문제이다., question: "복잡한 목적함수에서 안정적으로 좋은 해를 어떻게 찾을 수 있는가?", fields: [field:optimization]}
  - {<<: *field, id: problem:exploration-exploitation, name: 탐색과 활용, aliases: [Exploration-Exploitation], summary: 탐색과 활용은 알려진 보상을 얻는 행동과 새로운 정보를 얻는 행동 사이의 선택 문제이다., question: "에이전트는 보상 획득과 정보 탐색을 어떻게 균형 있게 수행할 수 있는가?", fields: [field:reinforcement-learning]}
  - {<<: *field, id: problem:sim-to-real-transfer, name: 시뮬레이션에서 현실로의 전이, aliases: [Sim-to-Real Transfer], summary: 시뮬레이션에서 현실로의 전이는 가상 환경에서 배운 정책이 실제 로봇에서 실패하는 문제이다., question: "시뮬레이션에서 학습한 제어 정책을 실제 환경에 어떻게 안전하게 이전할 수 있는가?", fields: [field:robotics-embodied-ai]}
  - {<<: *field, id: problem:robust-speech-recognition, name: 잡음 환경 음성 인식, aliases: [Robust Speech Recognition], summary: 잡음 환경 음성 인식은 배경 소리와 화자 차이가 인식 정확도를 낮추는 문제이다., question: "다양한 음향 조건에서 음성 인식 성능을 어떻게 유지할 수 있는가?", fields: [field:speech-audio]}
  - {<<: *field, id: problem:generative-fidelity-diversity, name: 생성 품질과 다양성, aliases: [Fidelity-Diversity Tradeoff], summary: 생성 품질과 다양성은 생성물이 사실적이면서도 충분히 다양한 표본을 포함해야 하는 문제이다., question: "생성 모델은 사실성과 표본 다양성을 어떻게 함께 확보할 수 있는가?", fields: [field:generative-models]}
  - {<<: *field, id: problem:cross-modal-grounding, name: 교차 모달 근거 연결, aliases: [Cross-Modal Grounding], summary: 교차 모달 근거 연결은 서로 다른 형식의 표현이 같은 대상과 사건을 가리키게 하는 문제이다., question: "이미지와 언어의 표현을 동일한 의미에 어떻게 연결할 수 있는가?", fields: [field:multimodal-learning]}
  - {<<: *field, id: problem:long-range-graph-dependencies, name: 그래프 장거리 의존성, aliases: [Long-Range Graph Dependencies], summary: 그래프 장거리 의존성은 먼 노드 사이의 정보가 여러 메시지 전달 단계에서 손실되는 문제이다., question: "그래프에서 먼 구조적 관계를 어떻게 효율적으로 활용할 수 있는가?", fields: [field:graph-machine-learning]}
  - {<<: *field, id: problem:commonsense-reasoning, name: 상식 추론, aliases: [Commonsense Reasoning], summary: 상식 추론은 명시되지 않은 일상 지식을 사용해 결론을 내리는 문제이다., question: "시스템은 불완전한 지식에서 상식적 결론을 어떻게 도출할 수 있는가?", fields: [field:knowledge-representation-reasoning]}
  - {<<: *field, id: problem:combinatorial-explosion, name: 조합 폭발, aliases: [Combinatorial Explosion], summary: 조합 폭발은 가능한 상태와 행동 계획의 수가 급격히 증가하는 문제이다., question: "매우 큰 탐색 공간에서 유용한 계획을 어떻게 계산할 수 있는가?", fields: [field:search-planning]}
  - {<<: *field, id: problem:agent-coordination, name: 에이전트 조정, aliases: [Agent Coordination], summary: 에이전트 조정은 여러 에이전트가 제한된 정보로 충돌 없이 공동 목표를 달성해야 하는 문제이다., question: "자율 에이전트들은 분산된 관측 아래 행동을 어떻게 조정할 수 있는가?", fields: [field:multi-agent-systems]}
  - {<<: *field, id: problem:goal-misalignment, name: 목표 불일치, aliases: [Goal Misalignment], summary: 목표 불일치는 최적화된 목표가 사람의 실제 의도와 다른 행동을 유도하는 문제이다., question: "시스템 목표가 사람의 의도와 지속적으로 일치하도록 어떻게 보장할 수 있는가?", fields: [field:ai-safety-alignment]}
  - {<<: *field, id: problem:opaque-model-decisions, name: 불투명한 모델 결정, aliases: [Opaque Model Decisions], summary: 불투명한 모델 결정은 복잡한 모델의 예측 근거를 사람이 확인하기 어려운 문제이다., question: "모델의 특정 예측이 나온 이유를 어떻게 검증 가능하게 설명할 수 있는가?", fields: [field:interpretability]}
  - {<<: *field, id: problem:algorithmic-discrimination, name: 알고리즘 차별, aliases: [Algorithmic Discrimination], summary: 알고리즘 차별은 자동화된 결정이 특정 집단에 불리한 결과를 낳는 문제이다., question: "자동화된 의사결정의 불공정한 영향을 어떻게 측정하고 완화할 수 있는가?", fields: [field:fairness-ethics]}
  - {<<: *field, id: problem:inference-cost, name: 추론 비용, aliases: [Inference Cost], summary: 추론 비용은 큰 모델이 서비스 환경에서 요구하는 지연시간과 자원 비용의 문제이다., question: "제한된 계산 자원에서 모델 추론 비용을 어떻게 줄일 수 있는가?", fields: [field:ml-systems-efficient-inference]}
  - {<<: *field, id: problem:ranking-relevance, name: 순위 관련성, aliases: [Ranking Relevance], summary: 순위 관련성은 사용자 의도에 가장 적합한 항목을 상위에 배치해야 하는 문제이다., question: "사용자에게 가장 관련성 높은 정보와 항목을 어떻게 순위화할 수 있는가?", fields: [field:information-retrieval-recommender-systems]}

methods:
  - {<<: *ku, id: method:bayesian-neural-network, name: 베이즈 신경망, aliases: [Bayesian Neural Network], summary: 베이즈 신경망은 가중치에 대한 확률분포로 예측 불확실성을 표현하는 모델링 방법이다., fields: [field:bayesian-learning]}
  - {<<: *ku, id: method:evidence-lower-bound, name: 증거 하한, aliases: [Evidence Lower Bound, ELBO], summary: 증거 하한은 변분 추론에서 로그 주변우도의 하한을 최적화하는 목적함수이다., fields: [field:variational-inference]}
  - {<<: *ku, id: method:gaussian-process-regression, name: 가우스 과정 회귀, aliases: [Gaussian Process Regression], summary: 가우스 과정 회귀는 관측된 함수 값으로부터 미관측 값의 분포를 예측하는 방법이다., fields: [field:gaussian-processes]}
  - {<<: *ku, id: method:temperature-scaling, name: 온도 보정, aliases: [Temperature Scaling], summary: 온도 보정은 분류 로그릿을 하나의 온도 매개변수로 조정해 확률을 보정하는 방법이다., fields: [field:uncertainty-calibration]}
  - {<<: *ku, id: method:pac-guarantee, name: PAC 보장, aliases: [PAC Guarantee], summary: PAC 보장은 표본 수와 오차 및 실패 확률 사이의 학습 보장을 나타내는 개념이다., fields: [field:pac-learning]}
  - {<<: *ku, id: method:generalization-bound, name: 일반화 경계, aliases: [Generalization Bound], summary: 일반화 경계는 경험적 위험과 참 위험의 차이에 대한 이론적 상한이다., fields: [field:generalization-theory]}
  - {<<: *ku, id: method:vc-dimension, name: VC 차원, aliases: [VC Dimension], summary: VC 차원은 이진 가설 집합이 분할할 수 있는 점 집합의 최대 크기를 나타내는 복잡도 척도이다., fields: [field:statistical-learning]}
  - {<<: *ku, id: method:neural-tangent-kernel, name: 신경 접선 커널, aliases: [Neural Tangent Kernel, NTK], summary: 신경 접선 커널은 매개변수 변화에 대한 신경망 출력 기울기의 내적으로 정의되는 커널이다., fields: [field:neural-tangent-kernels]}
  - {<<: *ku, id: method:stochastic-gradient-descent, name: 확률적 경사 하강법, aliases: [Stochastic Gradient Descent, SGD], summary: 확률적 경사 하강법은 미니배치 기울기로 매개변수를 반복 갱신하는 방법이다., fields: [field:gradient-methods]}
  - {<<: *ku, id: method:adam-optimizer, name: Adam 최적화기, aliases: [Adam], summary: Adam 최적화기는 일차 및 이차 모멘트 추정으로 매개변수별 학습률을 조정하는 방법이다., fields: [field:adaptive-optimization]}
  - {<<: *ku, id: method:newton-method, name: 뉴턴 방법, aliases: [Newton Method], summary: 뉴턴 방법은 헤시안 정보를 사용하여 이차 근사에 기반한 갱신을 수행하는 방법이다., fields: [field:second-order-optimization]}
  - {<<: *ku, id: method:projected-gradient-descent, name: 사영 경사 하강법, aliases: [Projected Gradient Descent, PGD], summary: 사영 경사 하강법은 각 갱신 뒤 해를 제약 집합으로 사영하는 방법이다., fields: [field:constrained-optimization]}
  - {<<: *ku, id: method:q-learning, name: Q 학습, aliases: [Q-Learning], summary: Q 학습은 최적 행동가치 함수의 벨만 방정식을 표본으로 근사하는 방법이다., fields: [field:value-based-rl]}
  - {<<: *ku, id: method:reinforce, name: REINFORCE, aliases: [REINFORCE], summary: REINFORCE는 반환값으로 정책의 로그확률 기울기를 가중하는 정책 경사 방법이다., fields: [field:policy-gradient]}
  - {<<: *ku, id: method:advantage-actor-critic, name: 이점 액터 크리틱, aliases: [Advantage Actor-Critic, A2C], summary: 이점 액터 크리틱은 가치 기준선을 사용해 정책 경사 분산을 줄이는 방법이다., fields: [field:actor-critic]}
  - {<<: *ku, id: method:world-model, name: 월드 모델, aliases: [World Model], summary: 월드 모델은 환경의 상태 전이와 관측을 예측하는 학습된 내부 모델이다., fields: [field:model-based-rl]}
  - {<<: *ku, id: method:visual-servoing, name: 시각 서보잉, aliases: [Visual Servoing], summary: 시각 서보잉은 카메라 관측의 오차를 이용해 로봇 움직임을 제어하는 방법이다., fields: [field:robot-learning]}
  - {<<: *ku, id: method:behavioral-cloning, name: 행동 복제, aliases: [Behavioral Cloning], summary: 행동 복제는 전문가의 상태와 행동 쌍을 지도학습으로 모방하는 방법이다., fields: [field:imitation-learning]}
  - {<<: *ku, id: method:rapidly-exploring-random-tree, name: 빠르게 탐색하는 무작위 트리, aliases: [Rapidly-exploring Random Tree, RRT], summary: 빠르게 탐색하는 무작위 트리는 무작위 표본으로 구성 공간을 확장하는 운동 계획 방법이다., fields: [field:motion-planning]}
  - {<<: *ku, id: method:bundle-adjustment, name: 번들 조정, aliases: [Bundle Adjustment], summary: 번들 조정은 카메라 자세와 3차원 점을 함께 최적화하는 추정 방법이다., fields: [field:simultaneous-localization-mapping]}
  - {<<: *ku, id: method:connectionist-temporal-classification, name: 연결주의 시간 분류, aliases: [Connectionist Temporal Classification, CTC], summary: 연결주의 시간 분류는 정렬되지 않은 입력과 출력 열의 확률을 합산하는 학습 방법이다., fields: [field:automatic-speech-recognition]}
  - {<<: *ku, id: method:neural-vocoder, name: 신경 보코더, aliases: [Neural Vocoder], summary: 신경 보코더는 음향 특징으로부터 고품질 음성 파형을 생성하는 모델 방법이다., fields: [field:speech-synthesis]}
  - {<<: *ku, id: method:contrastive-predictive-coding, name: 대조 예측 부호화, aliases: [Contrastive Predictive Coding, CPC], summary: 대조 예측 부호화는 미래 표현을 구별하는 대조 목적함수로 표현을 학습하는 방법이다., fields: [field:audio-representation-learning]}
  - {<<: *ku, id: method:speaker-embedding, name: 화자 임베딩, aliases: [Speaker Embedding], summary: 화자 임베딩은 화자 특성을 고정 길이 벡터로 표현하는 방법이다., fields: [field:speaker-recognition]}
  - {<<: *ku, id: method:variational-autoencoder, name: 변분 오토인코더, aliases: [Variational Autoencoder, VAE], summary: 변분 오토인코더는 인코더와 확률적 잠재변수 및 디코더로 데이터를 생성하는 모델이다., fields: [field:variational-autoencoders]}
  - {<<: *ku, id: method:generative-adversarial-network, name: 생성적 적대 신경망, aliases: [Generative Adversarial Network, GAN], summary: 생성적 적대 신경망은 생성자와 판별자가 미니맥스 게임을 수행하는 생성 모델이다., fields: [field:generative-adversarial-networks]}
  - {<<: *ku, id: method:denoising-diffusion, name: 잡음 제거 확산, aliases: [Denoising Diffusion], summary: 잡음 제거 확산은 순방향 잡음 과정의 역과정을 학습하여 표본을 생성하는 방법이다., fields: [field:diffusion-models]}
  - {<<: *ku, id: method:pixelrnn, name: PixelRNN, aliases: [PixelRNN], summary: PixelRNN은 이전 픽셀에 조건부로 이미지 픽셀 분포를 순차적으로 예측하는 모델이다., fields: [field:autoregressive-models]}
  - {<<: *ku, id: method:contrastive-language-image-pretraining, name: 대조 언어 이미지 사전학습, aliases: [Contrastive Language-Image Pre-training, CLIP], summary: 대조 언어 이미지 사전학습은 짝지은 이미지와 텍스트의 유사도를 높이는 방법이다., fields: [field:vision-language-learning]}
  - {<<: *ku, id: method:cross-attention-fusion, name: 교차 어텐션 융합, aliases: [Cross-Attention Fusion], summary: 교차 어텐션 융합은 한 모달리티의 표현으로 다른 모달리티의 정보를 선택하는 방법이다., fields: [field:multimodal-fusion]}
  - {<<: *ku, id: model:show-and-tell, name: Show and Tell, aliases: [Show and Tell], summary: Show and Tell은 이미지 표현을 조건으로 순환 신경망이 문장을 생성하는 캡셔닝 모델이다., fields: [field:image-captioning]}
  - {<<: *ku, id: method:joint-embedding-retrieval, name: 공동 임베딩 검색, aliases: [Joint Embedding Retrieval], summary: 공동 임베딩 검색은 서로 다른 모달리티를 비교 가능한 벡터 공간에 매핑하는 방법이다., fields: [field:multimodal-retrieval]}
  - {<<: *ku, id: method:message-passing, name: 메시지 전달, aliases: [Message Passing], summary: 메시지 전달은 이웃 노드의 정보를 집계해 노드 표현을 갱신하는 그래프 학습 방법이다., fields: [field:graph-neural-networks]}
  - {<<: *ku, id: method:node2vec, name: node2vec, aliases: [node2vec], summary: node2vec은 편향된 무작위 보행의 문맥으로 노드 임베딩을 학습하는 방법이다., fields: [field:graph-representation-learning]}
  - {<<: *ku, id: method:graph-attention-network, name: 그래프 어텐션 네트워크, aliases: [Graph Attention Network, GAT], summary: 그래프 어텐션 네트워크는 이웃별 어텐션 계수로 노드 표현을 갱신하는 방법이다., fields: [field:graph-attention]}
  - {<<: *ku, id: method:graph-variational-autoencoder, name: 그래프 변분 오토인코더, aliases: [Graph Variational Autoencoder, VGAE], summary: 그래프 변분 오토인코더는 잠재 노드 표현으로 그래프 구조를 생성하는 방법이다., fields: [field:graph-generative-models]}
  - {<<: *ku, id: method:knowledge-graph-embedding, name: 지식 그래프 임베딩, aliases: [Knowledge Graph Embedding], summary: 지식 그래프 임베딩은 엔티티와 관계를 벡터 공간에 표현하는 방법이다., fields: [field:knowledge-graphs]}
  - {<<: *ku, id: method:resolution-theorem-proving, name: 해소 정리 증명, aliases: [Resolution Theorem Proving], summary: 해소 정리 증명은 절 형태의 논리식에 해소 규칙을 반복 적용하는 추론 방법이다., fields: [field:automated-reasoning]}
  - {<<: *ku, id: method:differentiable-logic, name: 미분가능 논리, aliases: [Differentiable Logic], summary: 미분가능 논리는 논리 연산과 제약을 연속적이고 학습 가능한 형태로 완화하는 방법이다., fields: [field:neuro-symbolic-ai]}
  - {<<: *ku, id: concept:description-logic, name: 기술 논리, aliases: [Description Logic], summary: 기술 논리는 개념과 역할 및 개체에 대한 지식을 표현하는 형식 논리 계열이다., fields: [field:ontology-engineering]}
  - {<<: *ku, id: method:a-star-search, name: A 별 탐색, aliases: [A* Search], summary: A 별 탐색은 누적 비용과 휴리스틱 추정 비용의 합으로 노드를 선택하는 탐색 방법이다., fields: [field:heuristic-search]}
  - {<<: *ku, id: concept:planning-domain-definition-language, name: 계획 도메인 정의 언어, aliases: [Planning Domain Definition Language, PDDL], summary: 계획 도메인 정의 언어는 자동 계획 문제의 행동과 상태를 기술하는 표준 표현 언어이다., fields: [field:automated-planning]}
  - {<<: *ku, id: method:monte-carlo-tree-search, name: 몬테카를로 트리 탐색, aliases: [Monte Carlo Tree Search, MCTS], summary: 몬테카를로 트리 탐색은 시뮬레이션 결과로 트리의 선택과 확장을 안내하는 방법이다., fields: [field:monte-carlo-tree-search]}
  - {<<: *ku, id: method:hierarchical-task-network, name: 계층적 과업 네트워크, aliases: [Hierarchical Task Network, HTN], summary: 계층적 과업 네트워크는 복합 과업을 방법에 따라 하위 과업으로 분해하는 계획 방법이다., fields: [field:hierarchical-planning]}
  - {<<: *ku, id: method:centralized-training-decentralized-execution, name: 중앙집중 학습과 분산 실행, aliases: [Centralized Training with Decentralized Execution, CTDE], summary: 중앙집중 학습과 분산 실행은 학습 중 전역 정보를 쓰고 실행 중 지역 관측만 쓰는 방법이다., fields: [field:multi-agent-reinforcement-learning]}
  - {<<: *ku, id: method:multi-agent-credit-assignment, name: 다중 에이전트 공적 할당, aliases: [Multi-Agent Credit Assignment], summary: 다중 에이전트 공적 할당은 공동 보상에서 각 에이전트 행동의 기여를 추정하는 방법이다., fields: [field:cooperative-ai]}
  - {<<: *ku, id: method:referential-game, name: 지시 게임, aliases: [Referential Game], summary: 지시 게임은 한 에이전트가 메시지로 다른 에이전트가 목표 대상을 고르게 하는 학습 과업이다., fields: [field:emergent-communication]}
  - {<<: *ku, id: concept:incentive-compatibility, name: 유인 양립성, aliases: [Incentive Compatibility], summary: 유인 양립성은 참여자가 자신의 실제 정보나 선호를 드러내는 것이 최선이 되는 성질이다., fields: [field:mechanism-design]}
  - {<<: *ku, id: method:adversarial-training, name: 적대적 학습, aliases: [Adversarial Training], summary: 적대적 학습은 적대적 교란 예제를 포함하여 모델을 학습하는 견고성 방법이다., fields: [field:robustness]}
  - {<<: *ku, id: method:inverse-reinforcement-learning, name: 역강화학습, aliases: [Inverse Reinforcement Learning, IRL], summary: 역강화학습은 전문가 행동으로부터 그 행동을 설명하는 보상 함수를 추정하는 방법이다., fields: [field:reward-learning]}
  - {<<: *ku, id: method:preference-modeling, name: 선호 모델링, aliases: [Preference Modeling], summary: 선호 모델링은 두 응답이나 궤적 사이의 사람 선호를 예측하는 모델을 학습하는 방법이다., fields: [field:reinforcement-learning-from-human-feedback]}
  - {<<: *ku, id: method:capability-evaluation, name: 능력 평가, aliases: [Capability Evaluation], summary: 능력 평가는 정해진 과업과 기준으로 시스템의 수행 능력을 측정하는 방법이다., fields: [field:ai-evaluation]}
  - {<<: *ku, id: method:shapley-value-attribution, name: 샤플리 값 기여도, aliases: [Shapley Value Attribution], summary: 샤플리 값 기여도는 모든 특성 부분집합의 평균 한계 기여로 특성 중요도를 정하는 방법이다., fields: [field:feature-attribution]}
  - {<<: *ku, id: method:counterfactual-explanation, name: 반사실 설명, aliases: [Counterfactual Explanation], summary: 반사실 설명은 예측을 바꾸기 위해 필요한 최소 입력 변화를 제시하는 방법이다., fields: [field:example-based-explanations]}
  - {<<: *ku, id: method:activation-patching, name: 활성화 패칭, aliases: [Activation Patching], summary: 활성화 패칭은 한 실행의 내부 활성화를 다른 실행에 교체해 인과적 역할을 검사하는 방법이다., fields: [field:mechanistic-interpretability]}
  - {<<: *ku, id: method:testing-with-concept-activation-vectors, name: 개념 활성화 벡터 검정, aliases: [Testing with Concept Activation Vectors, TCAV], summary: 개념 활성화 벡터 검정은 사람 정의 개념 방향에 대한 모델 민감도를 측정하는 방법이다., fields: [field:concept-based-explanations]}
  - {<<: *ku, id: method:demographic-parity, name: 인구통계학적 동등성, aliases: [Demographic Parity], summary: 인구통계학적 동등성은 보호 집단별 긍정 예측 비율을 같게 하는 공정성 기준이다., fields: [field:algorithmic-fairness]}
  - {<<: *ku, id: method:differential-privacy, name: 차등 프라이버시, aliases: [Differential Privacy, DP], summary: 차등 프라이버시는 한 개인의 포함 여부가 출력 분포에 미치는 영향을 제한하는 보장이다., fields: [field:privacy-preserving-ml]}
  - {<<: *ku, id: concept:ai-audit, name: 인공지능 감사, aliases: [AI Audit], summary: 인공지능 감사는 시스템의 설계와 데이터 및 결과를 독립적으로 점검하는 절차이다., fields: [field:ai-governance]}
  - {<<: *ku, id: concept:model-card, name: 모델 카드, aliases: [Model Card], summary: 모델 카드는 모델의 의도된 사용과 성능 및 한계를 문서화하는 형식이다., fields: [field:responsible-ai]}
  - {<<: *ku, id: method:quantization, name: 양자화, aliases: [Quantization], summary: 양자화는 가중치와 활성값을 낮은 정밀도 수로 표현해 계산과 저장을 줄이는 방법이다., fields: [field:model-compression]}
  - {<<: *ku, id: method:linear-attention, name: 선형 어텐션, aliases: [Linear Attention], summary: 선형 어텐션은 어텐션 계산을 토큰 수에 대해 선형 또는 준선형으로 근사하는 방법이다., fields: [field:efficient-transformers]}
  - {<<: *ku, id: method:data-parallel-training, name: 데이터 병렬 학습, aliases: [Data Parallel Training], summary: 데이터 병렬 학습은 각 장치가 다른 미니배치의 기울기를 계산하고 이를 동기화하는 방법이다., fields: [field:distributed-training]}
  - {<<: *ku, id: method:federated-averaging, name: 연합 평균, aliases: [Federated Averaging, FedAvg], summary: 연합 평균은 참여 장치의 로컬 모델 갱신을 가중 평균해 전역 모델을 만드는 방법이다., fields: [field:federated-learning]}
  - {<<: *ku, id: method:cross-encoder-ranking, name: 교차 인코더 순위화, aliases: [Cross-Encoder Ranking], summary: 교차 인코더 순위화는 질의와 문서를 함께 인코딩하여 관련성 점수를 계산하는 방법이다., fields: [field:neural-information-retrieval]}
  - {<<: *ku, id: method:dense-passage-retrieval, name: 밀집 구절 검색, aliases: [Dense Passage Retrieval, DPR], summary: 밀집 구절 검색은 이중 인코더로 질문과 구절을 벡터화하여 검색하는 방법이다., fields: [field:dense-retrieval]}
  - {<<: *ku, id: method:matrix-factorization-recommender, name: 행렬 분해 추천, aliases: [Matrix Factorization], summary: 행렬 분해 추천은 사용자와 항목의 상호작용 행렬을 저차원 잠재 요인으로 분해하는 방법이다., fields: [field:collaborative-filtering]}
  - {<<: *ku, id: method:pairwise-ranking-loss, name: 쌍대 순위 손실, aliases: [Pairwise Ranking Loss], summary: 쌍대 순위 손실은 관련 항목의 점수가 비관련 항목보다 높도록 학습하는 목적함수이다., fields: [field:learning-to-rank]}
  - {<<: *ku, id: method:region-proposal-network, name: 영역 제안 네트워크, aliases: [Region Proposal Network, RPN], summary: 영역 제안 네트워크는 이미지 특징에서 객체 후보 경계 상자를 예측하는 방법이다., fields: [field:object-detection]}
  - {<<: *ku, id: model:fully-convolutional-network, name: 완전 합성곱 신경망, aliases: [Fully Convolutional Network, FCN], summary: 완전 합성곱 신경망은 합성곱 층만 사용해 픽셀 단위 예측을 수행하는 모델이다., fields: [field:semantic-segmentation]}
  - {<<: *ku, id: method:masked-image-modeling, name: 마스크 이미지 모델링, aliases: [Masked Image Modeling, MIM], summary: 마스크 이미지 모델링은 가려진 이미지 영역을 예측하도록 시각 표현을 학습하는 방법이다., fields: [field:visual-self-supervision]}
  - {<<: *ku, id: model:stylegan, name: StyleGAN, aliases: [StyleGAN], summary: StyleGAN은 잠재 스타일을 계층적으로 주입해 고해상도 이미지를 생성하는 모델이다., fields: [field:visual-generation]}
  - {<<: *ku, id: model:autoregressive-language-model, name: 자기회귀 언어 모델, aliases: [Autoregressive Language Model], summary: 자기회귀 언어 모델은 앞선 토큰에 조건부로 다음 토큰 확률을 모델링한다., fields: [field:language-modeling]}
  - {<<: *ku, id: method:named-entity-recognition, name: 개체명 인식, aliases: [Named Entity Recognition, NER], summary: 개체명 인식은 텍스트 토큰에 사람과 장소 및 조직 같은 개체 범주를 할당하는 방법이다., fields: [field:information-extraction]}
  - {<<: *ku, id: method:extractive-question-answering, name: 추출형 질의응답, aliases: [Extractive Question Answering], summary: 추출형 질의응답은 문맥에서 질문의 답이 되는 연속 구간을 선택하는 방법이다., fields: [field:question-answering]}
  - {<<: *ku, id: method:abstractive-summarization, name: 추상적 요약, aliases: [Abstractive Summarization], summary: 추상적 요약은 원문에 없는 표현도 사용하여 핵심 내용을 생성하는 방법이다., fields: [field:text-summarization]}

